 if(newJob)SAVE.jobs.push(res.job);
 // gia phả: đứa con nuôi tới 18 thành dòng của đời này (nuôi lại cùng đời thì thay dòng cũ)
 if(!early){SAVE.tree=SAVE.tree.filter(e=>e.n<S.gen.n);SAVE.tree.push({n:S.gen.n,name:S.name,sign:S.sign,fam:S.famStart||S.fam.id,role:S.role,end:res.id,job:res.job,t:Date.now()})}
 S.seen.forEach(id=>{if(!SAVE.cards.includes(id))SAVE.cards.push(id)});
 const fd=S.famStart||S.fam.id;if(!early&&!SAVE.famDone.includes(fd))SAVE.famDone.push(fd);
 if(!early&&!SAVE.signsDone.includes(S.sign))SAVE.signsDone.push(S.sign);
 SAVE.runs++;if(!early)SAVE.n18++;
 SAVE.best=betterBest(SAVE.best,{name:S.name,age,sign:S.sign,end:res.id,gen:S.gen.n,job:res.job||null,t:Date.now()});
 const newAch=E.checkAch(S,res,SAVE);SAVE.ach.push(...newAch);SAVE.run=null;persist();
 music(null);sfx(early?'end_early':'end',.8);if(newAch.length)sfx('ach',.6,1.2);
 setBg(early?'#FFB4A2':STAGES[5].bg);stageTile(early?-1:5);
 const n=counts();
 const mood=early?(early.endsWith('100')?'cringe':'cry'):(S.m[0]>=50?'happy':'sly');
 const sg=E.sign(S),moments=E.shuffle(S.log).slice(0,Math.max(0,(job?1:res.signLine?2:3)-(fe?1:0))).sort((a,b)=>a.age-b.age);
 const gen=S.gen.n>1?` · đời ${S.gen.n}`:'';
 app.innerHTML=`<div class="screen">
  <div class="share" id="share"><div class="k">${early?'Kết thúc sớm':'Hoàn thành'} · ${ageTxt(age).toLowerCase()}${gen}${isNew?' · <span class="new">kết mới</span>':''}</div>
   <div class="nm">${esc(S.name)}</div>${sg?`<div class="signtag" style="color:${EL_COLOR[sg.el]}">${zg(sg)} ${sg.name} · sinh ${esc(S.bday||'')}</div>`:''}
   <div class="face endface">${faceArt(early?S.stage:5,mood,S.style)}${art('end_'+res.id)?img(art('end_'+res.id),'endsticker'):''}</div>
   <div class="ttl">${esc(fill(res.title))}</div><div class="sub">${esc(fill(res.sub))}</div>
   ${job?`<div class="job"><small>18 tuổi, ${esc(S.name)} ${job.k?'thành':'chọn'}${newJob?' · <span class="new">nghề mới</span>':''}</small><b>${jobTxt(res.job)}</b><span>${esc(fill(job.sub))}</span></div>`:''}
   ${fe?`<div class="famend"><small>Kết riêng · ${feFam?esc(feFam.ico+' '+feFam.name):'gia cảnh'}</small><b>${esc(fill(LD.TITLES[fe][0]))}${feNew?' <span class="new">mới</span>':''}</b><span>${esc(fill(LD.TITLES[fe][1]))}</span></div>`:''}
   <div class="stats">${S.m.map((v,k)=>`<span>${MICON[k]}${v}</span>`).join('')}</div>
   ${res.quote&&!job?`<q>${esc(fill(res.quote))}</q>`:''}
   ${res.signLine&&sg?`<p class="signq"><b>${zg(sg)} ${sg.name} nói:</b> ${esc(fill(res.signLine))}</p>`:''}
   <div class="moments">${moments.map(x=>`<p><b>${ageTxt(x.age)}</b> ${esc(fill(x.r))}</p>`).join('')}</div>
   <div class="foot">CON NHÀ MÌNH · Phụ huynh hệ gì? Vuốt là biết</div></div>
  <div class="endbtns">${early?'':`<button class="main wide" id="next">Đời sau: ${esc(S.name)} làm phụ huynh →</button>`}<button id="again">Nuôi lại</button><button id="copy">Copy để khoe</button></div>
  <p class="note" id="note">Kết ${n.ends}/${E.ALL_ENDS.length} · nghề ${n.jobs}/${E.ALL_JOBS.length} · thẻ ${n.cards}/${CARD_IDS.size} · mục tiêu ${n.ach}/${E.ACH.length} · chụp màn hình để đăng story</p>
  ${early?'':`<button class="linkbtn" id="tree">Xem gia phả nhà mình (${SAVE.tree.length} đời) →</button>`}
  ${ACC.api&&!ACC.token?`<button class="linkbtn" id="acct2">${CLOUD} Tạo tài khoản để giữ bộ sưu tập khi đổi máy</button>`:''}</div>`;
 toast(newAch);
 const a2=app.querySelector('#acct2');
 if(a2)a2.onclick=()=>accountSheet(()=>{if(ACC.token){a2.innerHTML=CLOUD+' Đã lưu vào tài khoản '+esc(ACC.name);a2.disabled=true}});
 app.querySelector('#again').onclick=()=>{setGen(S.gen);newSign();setName(S.name);pick.style=Math.random()<.5?0:1;intro()};
 const nx=app.querySelector('#next');
 if(nx)nx.onclick=()=>{setGen({n:S.gen.n+1,parent:S.name,parentSign:S.sign,trait:res.id,traits:[res.id,...E.heirs(S.gen)].slice(0,E.HEIR_MAX),job:res.job||undefined});newSign();setName(newName(S.name));pick.style=Math.random()<.5?0:1;intro()};
 const tb=app.querySelector('#tree');if(tb)tb.onclick=treeSheet;
 app.querySelector('#copy').onclick=()=>{
  const txt=`Mình vừa nuôi ${S.name}${sg?` (cung ${sg.name})`:''} ${age?'tới '+age+' tuổi':'được vài tháng'}${S.gen.n>1?' (đời '+S.gen.n+')':''} trong game Con nhà mình: "${fill(res.title)}".${job?(job.k?` Lớn lên thành ${job.name}.`:` 18 tuổi chọn ${job.name.toLowerCase()}.`):''}${fe?` Kết riêng: "${fill(LD.TITLES[fe][0])}".`:''} 😆${S.m[0]} 🔋${S.m[1]} ❤️${S.m[2]}. Còn bạn, phụ huynh hệ gì? Vuốt là biết.`;
  const note=app.querySelector('#note');
  try{navigator.clipboard.writeText(txt).then(()=>note.textContent='Đã copy. Dán vào story nhé!',()=>note.textContent=txt)}catch(e){note.textContent=txt}
 };
}

document.addEventListener('keydown',e=>{if(onKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key===' '||e.key==='Enter')){e.preventDefault();if(!e.repeat)onKey(e.key)}});
// link nuôi chung (/?duo=<mã phòng>) thì vào phòng, còn lại về màn đầu
function boot(){const id=new URLSearchParams(location.search).get('duo');if(id&&ROOM_RE.test(id))return duoOpen(id);intro()}
Promise.race([loadArt(),new Promise(r=>setTimeout(r,2500))]).then(boot);
// có máy chủ thì hiện phần tài khoản; đã đăng nhập thì lấy tiến độ về rồi vẽ lại màn đầu (nếu người chơi còn ở đó)
apiCheck().then(async()=>{if(!ACC.api)return;if(ACC.token)await cloudPull();duoBackfill();
 if(!S&&app.querySelector('.logo')&&!app.querySelector('.sheet')&&!(document.activeElement&&document.activeElement.id==='nm'))intro()});
</script></body></html>
