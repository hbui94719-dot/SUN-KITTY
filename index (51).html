<!doctype html><html lang="vi"><head>
<meta charset="utf-8">
<title>Con nhà mình · Kitty</title>
<meta name="description" content="Vuốt một cái, con lớn một chút. Nuôi con từ lọt lòng tới 18 tuổi trong 6 phút.">
<meta property="og:type" content="website"><meta property="og:title" content="Con nhà mình">
<meta property="og:description" content="Vuốt một cái, con lớn một chút. Chưa đẻ hả? Thử nuôi đi.">
<meta name="theme-color" content="#FFCFE2">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Con nhà mình"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols&display=swap&text=%E2%99%88%E2%99%89%E2%99%8A%E2%99%8B%E2%99%8C%E2%99%8D%E2%99%8E%E2%99%8F%E2%99%90%E2%99%91%E2%99%92%E2%99%93">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap&subset=vietnamese">
<style>
/* Layout: one portrait phone screen — top meters, one swipeable sticker card, two answer buttons. Single bright look on purpose. */
:root{
  --ink:#5A2A4A; --paper:#FFFFFF; --stage:#FFCFE2; --muted:#74425E;
  --left:#E8274B; --right:#4C9BE8; --good:#22B07D;
  --display:"Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--body);transition:background .5s;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box;position:relative;overflow:hidden}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;padding-block:14px}
.sticker{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:5px 6px 0 var(--ink)}
h1,.disp{font-family:var(--display);font-weight:800;letter-spacing:-.01em;line-height:1}

/* intro */
.logo{font-size:clamp(36px,12.4vw,58px);white-space:nowrap;margin:18px 0 4px;text-wrap:balance}
.logo span{display:inline-block;background:var(--ink);color:var(--stage);padding:0 10px;border-radius:12px;transform:rotate(-3deg)}
.tag{font-size:16px;color:var(--muted);margin:6px 0 16px;line-height:1.4}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 8px}
.seg{display:flex;gap:10px}
.seg button{flex:1;font-size:17px;font-weight:700;padding:12px;border:3px solid var(--ink);border-radius:16px;background:var(--paper)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.namebox{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:17px}
.namebox b{font-family:var(--display);font-size:26px;flex:1}
.nmin{flex:1;min-width:0;font-family:var(--display);font-size:26px;font-weight:800;line-height:1.15;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed rgba(90,42,74,.35);border-radius:0;padding:0 0 2px;outline:none}
.nmin:focus{border-bottom:2px solid var(--ink)}
.nmin::placeholder{color:rgba(90,42,74,.35)}
.lbl small{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);margin-left:4px}
.nmerr{margin:6px 0 0;min-height:0}
.nmerr:empty{display:none}
.namebox button{border:2px solid var(--ink);border-radius:12px;background:var(--stage);font-weight:700;padding:6px 12px}
.fams{display:grid;gap:10px}
.fam{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:3px 4px 0 var(--ink);font-size:15px;transition:transform .1s}
.fam:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
.fam i{font-style:normal;font-size:28px}
.fam b{display:block;font-size:16px}
.fam small{color:var(--muted)}

/* game top */
.top{display:flex;align-items:center;gap:10px}
.age{font-family:var(--display);font-size:30px;line-height:1;min-width:0}
.age small{display:block;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meters{margin-left:auto;display:flex;gap:8px}
.meter{width:50px;text-align:center;position:relative}
.meter .ico{font-size:20px;line-height:1;height:26px;display:flex;justify-content:center}
.mi{width:26px;height:26px;display:block}
.mlabel{display:block;font-size:10.5px;font-weight:700;margin-top:3px;line-height:1;white-space:nowrap}
.dt{display:inline-flex;align-items:center;gap:2px;margin:0 3px;white-space:nowrap}.dt .mi{width:16px;height:16px}
.share .stats span{display:inline-flex;align-items:center;gap:4px}.share .stats .mi{width:20px;height:20px}
.gen .mi{width:15px;height:15px;display:inline-block;vertical-align:-2px}
.bar{height:40px;width:18px;margin:4px auto 0;border:2.5px solid var(--ink);border-radius:9px;background:var(--paper);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);transition:height .45s cubic-bezier(.3,1.4,.5,1)}
.bar.low i{background:var(--left)} .bar.high i{background:var(--right)}
.bar.low{border-color:var(--left)} .bar.high{border-color:var(--right)}
.meter .dot{position:absolute;top:-8px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink);opacity:0;transition:opacity .15s,transform .15s}
.meter .dot.on{opacity:1}.meter .dot.big{transform:scale(1.7)}
.meter .delta{position:absolute;top:22px;left:0;right:0;font-weight:800;font-size:15px;opacity:0}
.meter .delta.show{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.progress{height:6px;border-radius:3px;background:rgba(90,42,74,.15);margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .4s}

/* card */
.table{flex:1;position:relative;min-height:0;margin:14px 0 10px}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:16px 18px 18px;touch-action:none;will-change:transform;cursor:grab;transition:transform .25s}
.card.drag{transition:none;cursor:grabbing}
.who{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--stage);border:2px solid var(--ink);border-radius:999px;padding:3px 10px}
.face{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.say{font-size:19px;font-weight:600;line-height:1.38;text-align:center;text-wrap:balance;margin:6px 0 0;min-height:3em}
.hint{position:absolute;top:18px;font-family:var(--display);font-size:20px;padding:4px 12px;border:3px solid currentColor;border-radius:12px;opacity:0;background:var(--paper);max-width:58%;line-height:1.15;pointer-events:none}
.hint.l{right:16px;color:var(--left);transform:rotate(8deg)} .hint.r{left:16px;color:var(--right);transform:rotate(-8deg)}
.back{position:absolute;inset:10px -6px -6px 10px;z-index:-1;background:var(--paper);opacity:.55}

.opts{display:flex;gap:10px;padding-bottom:6px}
.opt{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.25;padding:13px 10px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:3px 4px 0 var(--ink);display:flex;align-items:center;gap:6px;text-align:left;transition:transform .1s,background .15s}
.opt.r{flex-direction:row-reverse;text-align:right}
.opt span{font-family:var(--display);font-size:22px;line-height:1}
.opt.l.hot{background:var(--left);color:#fff}.opt.r.hot{background:var(--right);color:#fff}
.opt:active{transform:translate(3px,4px);box-shadow:none}
.swipehint{text-align:center;font-size:12px;color:var(--muted);margin:0 0 4px}

/* reaction + splash */
.react .say{font-size:20px}
.react .tap,.tapn{font-size:13px;font-weight:700;color:var(--muted);margin-top:8px;animation:tapin .4s .6s both,tapbob 1.8s 1.4s ease-in-out infinite}
.tapn{display:block}
.splash .tapn{margin-top:14px;font-size:14px}
.dres .tapn{font-size:12.5px;margin-top:6px}
@keyframes tapin{from{opacity:0}to{opacity:1}}
@keyframes tapbob{50%{opacity:.45}}
.dopts.done .opt{pointer-events:none}
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;z-index:5;background:var(--stage);animation:in .35s ease-out;padding-inline:20px;box-sizing:border-box}
.splash .big{font-size:56px;text-wrap:balance;transform:rotate(-3deg)}
.splash p{font-size:16px;color:var(--muted);margin:0}
@keyframes in{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}

/* end */
.share{margin:6px auto 0;width:100%;max-width:330px;aspect-ratio:9/16;max-height:calc(100% - 180px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 18px 14px;box-sizing:border-box;background:var(--ink);color:var(--paper);border-radius:26px;position:relative;overflow:hidden}
.share .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.share .nm{font-family:var(--display);font-size:30px;margin-top:4px}
.share .face{max-height:34%}
.share .ttl{font-family:var(--display);font-size:27px;line-height:1.02;color:var(--stage);text-wrap:balance}
.share .sub{font-size:13px;opacity:.85;margin-top:4px}
.share .stats{display:flex;gap:14px;margin:10px 0 6px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.share q{font-size:14px;font-style:italic;line-height:1.35;opacity:.95;text-wrap:balance}
.moments{margin-top:12px;display:grid;gap:8px;text-align:left;width:100%}
.moments p{margin:0;font-size:12.5px;line-height:1.35;background:rgba(255,255,255,.08);border-radius:12px;padding:7px 10px}
.moments b{color:var(--stage);margin-right:4px}
.share .foot{margin-top:auto;font-size:11px;opacity:.6;letter-spacing:.06em}
.endbtns{display:flex;gap:10px;margin-top:14px}
.endbtns button{flex:1;font-size:16px;font-weight:700;padding:13px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:3px 4px 0 var(--ink)}
.endbtns button.main{background:var(--ink);color:var(--paper)}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;user-select:text;-webkit-user-select:text}
.face img.art{height:100%;max-height:300px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(90,42,74,.18))}
.endface{position:relative}
.endsticker{position:absolute;right:-6px;bottom:-4px;width:44%;max-width:140px;transform:rotate(8deg);filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35))}
.npc{position:absolute;top:44px;right:12px;width:26%;max-width:108px;transform:rotate(7deg);filter:drop-shadow(2px 3px 0 rgba(90,42,74,.25));pointer-events:none}
img.ico{width:24px;height:24px;object-fit:contain;display:block;margin:0 auto}
.fam img.ico{width:34px;height:34px}
body{background-size:256px;background-repeat:repeat}
/* bộ sưu tập, đời sau, đấu khẩu */
.screen.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.gen{background:var(--ink);color:var(--paper);border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.45;margin:4px 0 2px}
.gen small{opacity:.8}
.collbtn{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;font-size:13px;padding:10px 12px;border:2.5px dashed var(--ink);border-radius:16px;background:transparent}
.collbtn .go{font-weight:700;text-decoration:underline}
.linkbtn{margin:10px auto 0;display:block;background:none;border:0;font-size:13px;color:var(--muted);text-decoration:underline}
a.linkbtn{text-align:center}
.coll h1{font-size:40px;margin:6px 0 6px}
.coll h2{font-family:var(--display);font-size:22px;margin:18px 0 8px}
.coll h2 small{font-family:var(--body);font-size:13px;color:var(--muted)}
.cl{margin:0 0 6px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;background:var(--paper);opacity:.6;min-width:0}
.chip.got{opacity:1;box-shadow:3px 3px 0 var(--ink)}
.chip b{display:block;font-size:14px;line-height:1.2}
.chip small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:3px}
.achlist{display:grid;gap:8px}
.ach{display:flex;gap:10px;align-items:center;border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;background:var(--paper);opacity:.6}
.ach.got{opacity:1;box-shadow:3px 3px 0 var(--ink)}
.ach i{font-style:normal;font-size:22px}
.ach b{display:block;font-size:14px}.ach small{color:var(--muted);font-size:12px}
.toast{position:absolute;left:16px;right:16px;top:12px;z-index:10;background:var(--ink);color:var(--paper);border-radius:16px;padding:8px 14px;box-shadow:4px 5px 0 rgba(90,42,74,.35);animation:toastin .4s ease-out}
.toast p{margin:6px 0;font-size:14px;line-height:1.3}.toast small{opacity:.8}
@keyframes toastin{from{transform:translateY(-120%)}to{transform:none}}
.endbtns{flex-wrap:wrap}
.endbtns button{min-width:0}
.endbtns .wide{flex-basis:100%}
.duel .top{justify-content:space-between}
.score{display:flex;gap:4px;font-size:24px}.score i{font-style:normal;filter:grayscale(1);opacity:.35;transition:all .3s}.score i.won{filter:none;opacity:1;transform:scale(1.15)}
.timer{height:12px;border:2.5px solid var(--ink);border-radius:8px;background:var(--paper);overflow:hidden;margin-top:12px}
.timer i{display:block;height:100%;background:var(--left);animation:drain linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.arena{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 0}
.bac{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bac .bacph{width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);background:#FFE3F0;display:grid;place-items:center;font-size:48px;box-shadow:3px 4px 0 var(--ink)}
.bac .bacimg{width:96px;height:96px;object-fit:contain}
.dres{margin:0;font-size:15px;font-weight:700;text-align:center;text-wrap:balance}
.dres.w{color:#13744F}.dres.l{color:#B3261E}
.kid{height:120px;display:flex;justify-content:center;position:relative}
.kid .sgburst{top:50%}
.sgburst.art{background:none;border:0;width:46px;height:46px}.sgburst.art .zgi{width:46px;height:46px;vertical-align:0}
.sigfloat .zgi{width:40px;height:40px;vertical-align:0}.kid img{height:100%;width:auto}
.dopts{display:grid;gap:10px;padding-bottom:6px}
.dopts .opt span{font-size:20px}
.opt.right{background:var(--good);color:#fff}.opt.wrong{background:var(--left);color:#fff}
.opt:disabled{cursor:default}
.big2{font-size:28px}
.signbtn{margin-top:8px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);font-size:15px;font-weight:700}
.signbtn small{font-size:12px;color:var(--muted);font-weight:600}
.splash .signline{max-width:300px;font-size:15px;font-weight:600;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;line-height:1.35;box-shadow:3px 4px 0 var(--ink);margin-top:8px}
.signbadge{margin:8px 0 0;font-size:13px;line-height:1.35;text-align:center;border-radius:12px;padding:6px 10px;border:2px solid var(--ink)}
.signbadge.like{background:#DDF7EC}.signbadge.dislike{background:#FFE0E8}
.signbadge b{white-space:nowrap}
.share .signtag{font-size:12px;font-weight:700;opacity:.85;margin-top:2px;letter-spacing:.02em}
.share .signq{margin:8px 0 0;font-size:13px;line-height:1.35;opacity:.95;text-wrap:balance}
.share .signq b{color:var(--stage)}
.signgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.signgrid span{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;border:2px solid var(--ink);border-radius:12px;padding:5px 2px;background:var(--paper);opacity:.45}
.signgrid span.got{opacity:1;box-shadow:2px 2px 0 var(--ink)}
.signgrid i{font-style:normal;font-size:20px}
.kidq{margin:8px 0 0;font-size:15px;line-height:1.35;text-align:center;font-style:italic;text-wrap:balance}
.kidq b{font-style:normal;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:3px}
.zg{font-family:"Noto Sans Symbols","Segoe UI Symbol","Apple Symbols",sans-serif;font-style:normal;font-weight:400;line-height:1}
.card.sigfx{border-color:var(--el);box-shadow:5px 6px 0 var(--el);transition:border-color .3s,box-shadow .3s}
.sigfx .who{border-color:var(--el)}
.sigfloat{position:absolute;top:12px;right:14px;font-size:28px;color:var(--el);z-index:2;animation:sgpop .5s cubic-bezier(.2,1.8,.4,1) both,sgbob 1.6s ease-in-out .5s infinite}
@keyframes sgpop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sgbob{50%{transform:translateY(-5px)}}
.sgburst{position:absolute;left:50%;top:42%;width:38px;height:38px;display:grid;place-items:center;font-size:22px;color:var(--el);background:var(--paper);border:2.5px solid var(--el);border-radius:50%;opacity:0;pointer-events:none;z-index:2;animation:sgfly 1.4s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes sgfly{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}12%{opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.05) rotate(var(--rot));opacity:0}}
.signgrid i .zg{font-size:20px}
.duelsign{font-size:12px;font-weight:700;background:var(--paper);border:2.5px solid var(--el);border-radius:999px;padding:3px 12px;margin-bottom:-2px}
.duelsign .zg{color:var(--el);font-size:15px}
.zgi{height:1.25em;width:auto;vertical-align:-.28em}
.score img.lant{width:28px;height:28px;object-fit:contain;filter:grayscale(1);opacity:.4}.score img.lant.won{filter:none;opacity:1}
img.achi{width:26px;height:26px;object-fit:contain;vertical-align:middle}
.sndbtn{margin:0 auto 0 4px;width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--paper);padding:0;flex:none}
.sndbtn[aria-pressed=true]{opacity:.55}
.duel .sndbtn{display:none}
.sndrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.pill{font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:5px 12px}
.pill[aria-pressed=false]{opacity:.55}
.tag b{color:var(--ink);font-size:18px}
input{font:inherit;font-size:16px;color:var(--ink);user-select:text;-webkit-user-select:text}
.resume{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;margin:6px 0 2px}
.resume .rinfo{min-width:0;flex:1}
.resume b{display:block;font-family:var(--display);font-size:21px;line-height:1.1}
.resume small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.rbtn{flex:none;font-size:15px;font-weight:700;padding:10px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--paper)}
.acct{margin-top:10px;width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 12px;border:2.5px solid var(--ink);border-radius:16px;background:var(--paper);font-size:14px}
.acct small{font-size:12px;color:var(--muted)}
.cld{vertical-align:-4px;margin-right:1px;color:var(--ink)}
.sheet{position:absolute;inset:0;z-index:30;background:rgba(90,42,74,.5);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;animation:in .2s ease-out}

<script>
// ---------- art (web/art/ + manifest.json; ảnh tùy chọn nào thiếu thì dùng emoji / ký hiệu) ----------
let ART=new Set();
const STAGE_KEYS=['baby','preschool','primary','middle','high','adult18'];
async function loadArt(){try{const r=await fetch('art/manifest.json',{cache:'no-cache'});if(r.ok){const j=await r.json();ART=new Set(j.files||[])}}catch(e){}}
const _GM={};
function genArt(k){if(k in _GM)return _GM[k];let s=null,m;
 if(m=k.match(/^duel_bac_(trai|gai)(?:_(shock|mad))?$/))s=bacSvg(m[1],m[2]||'ok');
 else if(k==='duel_ba_chu_toa')s=bacSvg('gai','ok',1);
 else if(m=k.match(/^duel_parent_(bo|me)$/))s=parSvg(m[1]=='bo');
 else if(m=k.match(/^bg_stage_(\d)$/))s=bgSvg(+m[1]);
 else if(k==='scene_tet')s=sceneSvg(1);else if(k==='scene_hanhlang')s=sceneSvg(0);
 else if(m=k.match(/^end_(.+)$/)){const e={banthan:'🤝',binhthuong:'⚖️',chieu:'🎀',chill:'😎',hai:'🤡',hetpin:'🪫',kiluat:'📋',lo:'☂️',pin0:'🔋',pin100:'🛋️',song:'📱',than0:'🧊',than100:'🧲',vui0:'😢',vui100:'👑'}[m[1]];if(e)s=badge(e)}
 else if(m=k.match(/^ev_(.+)$/)){const e={hoc:'📜',nghe:'🖼️',the:'🏅',giao:'🎤',tech:'🤖'}[m[1]];if(e)s=badge(e,1)}
 return _GM[k]=s?'data:image/svg+xml;utf8,'+encodeURIComponent(s):null}
function badge(e,sq){return `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><${sq?'rect x="8" y="8" width="104" height="104" rx="22"':'circle cx="60" cy="60" r="52"'} fill="#FFF0F6" stroke="#5A2A4A" stroke-width="5"/><text x="60" y="80" font-size="58" text-anchor="middle">${e}</text></svg>`}
function bacSvg(g,mood,judge){const I='#5A2A4A',sk='#F2C7A0',gr=judge?'#fff':'#D9D9E3',gl=g=='gai',st=(f)=>`fill="${f}" stroke="${I}" stroke-width="4" stroke-linejoin="round"`;
 let h=`<path d="M24 240Q24 168 100 168Q176 168 176 240Z" ${st(judge?'#8B6CF0':gl?'#E8274B':'#4C9BE8')}/>`;
 if(gl)h+=`<circle cx="100" cy="34" r="24" ${st(gr)}/>`;
 h+=`<ellipse cx="42" cy="104" rx="14" ry="22" ${st(gr)}/><ellipse cx="158" cy="104" rx="14" ry="22" ${st(gr)}/><circle cx="100" cy="104" r="60" ${st(sk)}/>`;
 h+=gl?`<path d="M42 92Q44 46 100 44Q156 46 158 92Q130 62 100 62Q70 62 42 92Z" ${st(gr)}/><circle cx="40" cy="128" r="6" ${st('#FFD23F')}/><circle cx="160" cy="128" r="6" ${st('#FFD23F')}/>`:`<path d="M82 52Q100 40 118 52M90 60Q100 54 110 60" fill="none" stroke="${I}" stroke-width="3" stroke-linecap="round"/>`;
 h+=`<path d="M52 128q6 6 12 0M136 128q6 6 12 0" fill="none" stroke="#C99A78" stroke-width="3"/><ellipse cx="62" cy="122" rx="9" ry="6" fill="${mood=='mad'?'#E8274B':'#FF8FA3'}" opacity="${mood=='mad'?.8:.5}"/><ellipse cx="138" cy="122" rx="9" ry="6" fill="${mood=='mad'?'#E8274B':'#FF8FA3'}" opacity="${mood=='mad'?.8:.5}"/>`;
 const L=(d,w=4)=>`<path d="${d}" fill="none" stroke="${I}" stroke-width="${w}" stroke-linecap="round"/>`;
 h+=`<circle cx="76" cy="100" r="15" fill="#fff" fill-opacity=".6" stroke="${I}" stroke-width="3"/><circle cx="124" cy="100" r="15" fill="#fff" fill-opacity=".6" stroke="${I}" stroke-width="3"/>`+L('M91 100H109',3);
 if(mood=='shock')h+=`<circle cx="76" cy="100" r="7" fill="${I}"/><circle cx="124" cy="100" r="7" fill="${I}"/>`+L('M62 76Q76 66 90 76M110 76Q124 66 138 76',3)+`<ellipse cx="100" cy="146" rx="9" ry="13" fill="#9B2D3A" stroke="${I}" stroke-width="3"/>`;
 else if(mood=='mad')h+=`<circle cx="78" cy="102" r="5" fill="${I}"/><circle cx="122" cy="102" r="5" fill="${I}"/>`+L('M60 80L90 90M140 80L110 90',5)+L('M80 152Q100 134 120 152');
 else h+=`<circle cx="76" cy="102" r="5" fill="${I}"/><circle cx="124" cy="102" r="5" fill="${I}"/>`+L('M80 140Q100 158 120 140');
 if(judge)h+=`<rect x="128" y="196" width="56" height="16" rx="5" fill="#8A5A2B" stroke="${I}" stroke-width="3" transform="rotate(-20 156 204)"/><rect x="146" y="206" width="10" height="34" rx="4" fill="#8A5A2B" stroke="${I}" stroke-width="3" transform="rotate(-20 150 222)"/>`;
 return `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">${h}</svg>`}
function parSvg(bo){const I='#5A2A4A',sk='#FFD2B3',hc='#3B2A20',st=f=>`fill="${f}" stroke="${I}" stroke-width="4" stroke-linejoin="round"`,L=(d,w=4)=>`<path d="${d}" fill="none" stroke="${I}" stroke-width="${w}" stroke-linecap="round"/>`;
 let h=`<path d="M10 240Q10 172 80 172Q150 172 150 240Z" ${st(bo?'#4C9BE8':'#FF6FA5')}/><path d="M120 196L204 150" stroke="${I}" stroke-width="30" stroke-linecap="round"/><path d="M120 196L204 150" stroke="${sk}" stroke-width="22" stroke-linecap="round"/><path d="M204 150L236 134" stroke="${I}" stroke-width="12" stroke-linecap="round"/><path d="M204 150L236 134" stroke="${sk}" stroke-width="6" stroke-linecap="round"/>`;
 if(!bo)h+=`<ellipse cx="22" cy="130" rx="16" ry="44" ${st(hc)}/><ellipse cx="138" cy="130" rx="16" ry="44" ${st(hc)}/>`;
 h+=`<circle cx="80" cy="108" r="58" ${st(sk)}/><path d="M24 98Q26 48 80 46Q134 48 136 98Q108 66 80 66Q52 66 24 98Z" ${st(hc)}/>`+L('M52 92L74 100M108 92L86 100',5)+`<circle cx="62" cy="108" r="5" fill="${I}"/><circle cx="98" cy="108" r="5" fill="${I}"/><ellipse cx="80" cy="144" rx="14" ry="12" fill="#9B2D3A" stroke="${I}" stroke-width="3"/>`;
 return `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">${h}</svg>`}
function bgSvg(i){const c=['#FF6FA5','#FFB020','#22B07D','#4C9BE8','#8B6CF0','#E8274B'][i],sh=[`<circle cx="40" cy="40" r="12"/><path d="M170 60c-10-14-26 0-10 14l10 8 10-8c16-14 0-28-10-14z"/>`,`<path d="M40 30l6 14 15 1-11 10 4 15-14-8-14 8 4-15-11-10 15-1z"/><circle cx="180" cy="70" r="8"/>`,`<rect x="30" y="30" width="12" height="46" rx="3" transform="rotate(35 36 53)"/><rect x="170" y="150" width="12" height="46" rx="3" transform="rotate(-30 176 173)"/>`,`<path d="M40 40l20 36H20z"/><circle cx="180" cy="60" r="9"/>`,`<rect x="30" y="30" width="26" height="26" rx="5" transform="rotate(20 43 43)"/><path d="M180 50l10 10-10 10-10-10z"/>`,`<circle cx="40" cy="40" r="7"/><rect x="170" y="50" width="22" height="8" rx="3" transform="rotate(40 181 54)"/><path d="M100 150l8 14-16 0z"/>`][i];
 return `<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><g fill="${c}" opacity=".16">${sh}<g transform="translate(128 128)">${sh}</g></g></svg>`}
function sceneSvg(t){const o=t?`<rect width="400" height="700" fill="#FF9B85"/><path d="M0 560H400V700H0Z" fill="#C9553E"/><path d="M-10 120C80 90 140 130 230 90S340 80 420 110" fill="none" stroke="#6B3A2A" stroke-width="10"/>${[60,150,250,340,110,300].map((x,i)=>`<circle cx="${x}" cy="${100+i*14%60}" r="14" fill="#FFB7C5" stroke="#5A2A4A" stroke-width="3"/>`).join('')}${[70,330].map(x=>`<g><path d="M${x} 0V70" stroke="#5A2A4A" stroke-width="3"/><ellipse cx="${x}" cy="100" rx="30" ry="38" fill="#E8274B" stroke="#5A2A4A" stroke-width="4"/><path d="M${x} 138v26" stroke="#FFD23F" stroke-width="5"/></g>`).join('')}`:`<rect width="400" height="700" fill="#D9D3C7"/><path d="M0 0L130 200V520L0 700Z M400 0L270 200V520L400 700Z" fill="#C4BCAE"/><rect x="130" y="200" width="140" height="320" fill="#EFEAE0" stroke="#5A2A4A" stroke-width="3"/><path d="M0 700L130 520H270L400 700Z" fill="#B5AC9D"/>`;
 return `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="700" viewBox="0 0 400 700">${o}</svg>`}
function art(base){for(const x of ['webp','png'])if(ART.has(base+'.'+x))return 'art/'+base+'.'+x;return genArt(base)}
function img(src,cls){return `<img class="${cls||'art'}" src="${src}" alt="" draggable="false">`}
// mặt con: đủ 84 hình (6 tuổi × 2 kiểu × 7 biểu cảm); danh sách ảnh chưa tải được thì vẫn dùng đúng đường dẫn
const NPCE={bac_ho:'🧓',bac_si:'🧑‍⚕️',shipper:'🛵',ong_ba:'👵',sep:'👔',me_bin:'👩',khung_long:'🦖',chao:'🍳',ca_vang:'🐟',co_giao:'👩‍🏫',ga_con:'🐥',ga_trong:'🐓',cho_con:'🐶',cho_lon:'🐕',cho_gia:'🐕‍🦺',bac_tet:'🧓',hacam:'😈',kenh:'🎬',dan:'🎸',hoi_ban:'👯',ban_than:'🧒',crush:'💌',bao_ve:'💂',ong:'👴',heo_dat:'🐷',mam_dau:'🌱',gian_dau:'🌿',quan_ly:'🧑‍💼',hang_xom:'🚪',ong_rau_trang:'🎅',ba:'👵'};
function svgFace(stage,mood,style){const I='#5A2A4A',sk=style?'#E8B48A':'#FFD2B3',hc=style?'#3B2A20':'#5A2A4A',r=[60,62,64,66,68,70][stage]||64,cy=96,EY=cy-4,MY=cy+30,sh=['#FF9BB5','#FFD23F','#8EDDB0','#4C9BE8','#B58CF0','#E8274B'][stage]||'#4D96FF';
 const L=(d,w=4,f='none')=>`<path d="${d}" fill="${f}" stroke="${I}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`,C=(x,y,rr,f)=>`<circle cx="${x}" cy="${y}" r="${rr}" fill="${f}" stroke="${I}" stroke-width="3"/>`;
 let h=L(`M36 220Q36 ${cy+r-8} 100 ${cy+r-8}Q164 ${cy+r-8} 164 220Z`,4,sh);
 if(stage==2)h+=L(`M70 ${cy+r-6}V220M130 ${cy+r-6}V220`,8);
 if(style)h+=C(100-r-4,cy+6,15,hc)+C(100+r+4,cy+6,15,hc);
 h+=`<path d="M${100-r*.86} ${cy-r*.4}L${100-r*.8} ${cy-r-16}L${100-r*.2} ${cy-r+2}Z" fill="${sk}" stroke="${I}" stroke-width="4" stroke-linejoin="round"/><path d="M${100+r*.86} ${cy-r*.4}L${100+r*.8} ${cy-r-16}L${100+r*.2} ${cy-r+2}Z" fill="${sk}" stroke="${I}" stroke-width="4" stroke-linejoin="round"/><path d="M${100-r*.7} ${cy-r*.62}L${100-r*.68} ${cy-r-4}L${100-r*.38} ${cy-r+4}Z" fill="#FFB3CF"/>`;
 h+=`<circle cx="100" cy="${cy}" r="${r}" fill="${sk}" stroke="${I}" stroke-width="4"/>`;
 h+=L(`M${100-r+2} ${cy-8}Q${100-r+6} ${cy-r-6} 100 ${cy-r-4}Q${100+r-6} ${cy-r-6} ${100+r-2} ${cy-8}Q100 ${cy-r+24} ${100-r+2} ${cy-8}Z`,4,hc);
 h+=`<g transform="translate(${100+r*.55} ${cy-r+4}) rotate(14)"><path d="M0 0L-24 -15Q-30 0 -24 15Z" fill="#E8274B" stroke="${I}" stroke-width="3" stroke-linejoin="round"/><path d="M0 0L24 -15Q30 0 24 15Z" fill="#E8274B" stroke="${I}" stroke-width="3" stroke-linejoin="round"/><circle r="7" fill="#FF6FA5" stroke="${I}" stroke-width="3"/></g>`;
 if(stage==0)h+=L(`M100 ${cy-r-2}q-8 -18 8 -22q12 4 -2 14`,4);
 if(stage==1)h+=C(138,cy-r+10,10,'#FF6FA5')+C(122,cy-r+8,8,'#FF6FA5');
 if(stage==4)h+=L(`M${100-r-2} ${cy}A${r+2} ${r+2} 0 0 1 ${100+r+2} ${cy}`,7)+`<rect x="${100-r-10}" y="${cy-8}" width="16" height="30" rx="7" fill="#FFD23F" stroke="${I}" stroke-width="3"/><rect x="${100+r-6}" y="${cy-8}" width="16" height="30" rx="7" fill="#FFD23F" stroke="${I}" stroke-width="3"/>`;
 if(stage==5)h+=L(`M44 ${cy-r+8}L100 ${cy-r-20}L156 ${cy-r+8}L100 ${cy-r+34}Z`,4,I)+L(`M148 ${cy-r+10}V${cy-r+40}`,4);

const _mf=m=>440*Math.pow(2,(m-69)/12);
function tone(t,f,d,vol,type,glide){const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
 if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,.0002),t+.012);
 g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(SND.master);o.start(t);o.stop(t+d+.05)}
function bell(t,m,d,v,dest){const c=SND.ctx,f=_mf(m);
 [[1,1],[2,.32],[3.01,.1]].forEach(([k,a])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*k;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(v*a,.0002),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d/k**.5);
  o.connect(g);g.connect(dest||SND.master);o.start(t);o.stop(t+d+.05)})}
const run=(t,ms,step,d,v)=>ms.forEach((m,i)=>bell(t+i*step,m,d,v));

 const k=n==='stage'||n==='end'?9:n==='duel_win'?7:5;

 if(!/^[\p{L}\p{M}\p{N}][\p{L}\p{M}\p{N} '.-]*$/u.test(s))return 'Tên chỉ gồm chữ, số và khoảng trắng thôi nha.';
 if(s.toLowerCase().split(/[ '.-]+/).some(t=>KID_BAD.has(t)))return 'Tên này hơi gắt, chọn tên khác nha.';
 return ''}

// ---------- lưu tiến độ: luôn lưu trên máy; có tài khoản thì đồng bộ lên máy chủ (worker/index.js) ----------
// SAVE = { t, endings[], cards[], ach[], famDone[], signsDone[], jobs[], gen (đời đang chơi), run (ván đang dở), tree (gia phả), duo (kết quả nuôi chung) }
const CARD_IDS=new Set(LD.CARDS.map(E.cardId)),CARD_BY_ID=new Map(LD.CARDS.map(c=>[E.cardId(c),c]));
const LISTS=['endings','cards','ach','famDone','signsDone','jobs'];
function normSave(s){s=s&&typeof s==='object'&&!Array.isArray(s)?s:{};for(const k of LISTS)if(!Array.isArray(s[k]))s[k]=[];s.t=+s.t||0;s.gen=cleanGen(s.gen);s.run=s.run&&typeof s.run==='object'?s.run:null;
 s.best=cleanBest(s.best);s.n18=Math.max(0,Math.floor(+s.n18)||0);s.runs=Math.max(0,Math.floor(+s.runs)||0);s.tut=s.tut?1:0;s.tree=cleanTree(s.tree);s.duo=cleanDuo(s.duo);return s}
// kết quả nuôi chung (bảng xếp hạng, giống worker/index.js): ca = số ván chia ca tới 18, cung = độ hợp cao nhất (%) và cn = số ván cùng vuốt tới 18,
// ck / cp = số ván thắng ở kiểu một người làm con (khi làm con / khi làm bố mẹ)
const DUO_N=['ca','cn','ck','cp'];
function cleanDuo(d){d=d&&typeof d==='object'&&!Array.isArray(d)?d:{};const o={};for(const k of DUO_N)o[k]=Math.max(0,Math.floor(+d[k])||0);o.cung=o.cn?Math.max(0,Math.min(100,Math.floor(+d.cung)||0)):0;return o}
const maxDuo=(a,b)=>Object.fromEntries([...DUO_N,'cung'].map(k=>[k,Math.max(a[k],b[k])]));
// gia phả của dòng họ đang chơi: mỗi đời một dòng { n, name, sign, fam, role, end, job, t } (đứa con nuôi tới 18 gần nhất của đời đó)
function cleanTree(t){if(!Array.isArray(t))return[];const seen=new Set();
 return t.filter(e=>e&&typeof e==='object'&&typeof e.name==='string').map(e=>({n:Math.max(1,Math.min(999,Math.floor(+e.n)||1)),name:e.name.slice(0,20),
  sign:E.signById(e.sign)?e.sign:null,fam:LD.FAMS.some(f=>f.id===e.fam)?e.fam:null,role:e.role==='bố'?'bố':'mẹ',end:E.ALL_ENDS.includes(e.end)?e.end:null,job:jobOf(e.job)?e.job:null,t:+e.t||0}))
  .filter(e=>!seen.has(e.n)&&seen.add(e.n)).sort((a,b)=>a.n-b.n).slice(-60)}
// đứa con nuôi được xa nhất: { name, age, sign, end, gen, job, t } (hiện trên bảng xếp hạng)
function cleanBest(b){if(!b||typeof b!=='object'||typeof b.name!=='string')return null;const age=Math.floor(+b.age);if(!(age>=0&&age<=18))return null;
 return{name:b.name.slice(0,20),age,sign:E.signById(b.sign)?b.sign:null,end:typeof b.end==='string'?b.end:null,gen:Math.max(1,Math.floor(+b.gen)||1),job:jobOf(b.job)?b.job:null,t:+b.t||0}}
const betterBest=(a,b)=>!a?b:!b?a:(b.age>a.age||(b.age===a.age&&b.t>=a.t))?b:a;
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function cleanGen(g){const n=g&&Math.floor(+g.n);if(!(n>=1))return null;
 return{n:Math.min(n,999),parent:typeof g.parent==='string'?g.parent.slice(0,20):'',parentSign:E.signById(g.parentSign)?g.parentSign:undefined,trait:own(LD.TRAITS,g.trait)?g.trait:undefined,
  traits:Array.isArray(g.traits)?g.traits.filter(id=>typeof id==='string'&&own(LD.TRAITS,id)).slice(0,E.HEIR_MAX):undefined,job:jobOf(g.job)?g.job:undefined}}
// gộp hai bản lưu: danh sách cộng dồn (không bao giờ mất), đời, gia phả và ván đang dở lấy theo bản mới hơn
// (gia phả: bản mới hơn chưa có mà vẫn đang ở đời sau, tức là lưu từ bản game cũ, thì giữ gia phả của bản kia)
function mergeSave(a,b){const n=b.t>a.t?b:a,o={t:Math.max(a.t,b.t),gen:n.gen,run:n.run,tree:n.tree.length||!(n.gen&&n.gen.n>1)?n.tree:(n===a?b:a).tree,best:betterBest(a.best,b.best),n18:Math.max(a.n18,b.n18),runs:Math.max(a.runs,b.runs),tut:a.tut||b.tut?1:0,duo:maxDuo(a.duo,b.duo)};
 for(const k of LISTS)o[k]=[...new Set([...a[k],...b[k]])];return o}
function loadSave(){try{return normSave(JSON.parse(localStorage.getItem('ld-save')||'{}'))}catch(e){return normSave({})}}
let SAVE=loadSave();
if(SAVE.gen)pick.gen=SAVE.gen;
try{const n=cleanKidName(localStorage.getItem('ld-name'));if(n&&!kidNameErr(n)&&n!==(pick.gen.parent||''))pick.name=n}catch(e){}
function persistLocal(){try{localStorage.setItem('ld-save',JSON.stringify(SAVE))}catch(e){}}
function persist(){SAVE.t=Date.now();persistLocal();cloudPush()}
function setGen(g){pick.gen=g;SAVE.gen=g.n>1?g:null;persist()}
function counts(){return{ends:SAVE.endings.filter(id=>E.ALL_ENDS.includes(id)).length,jobs:SAVE.jobs.filter(id=>E.ALL_JOBS.includes(id)).length,cards:SAVE.cards.filter(id=>CARD_IDS.has(id)).length,ach:SAVE.ach.length}}

// ván đang dở: lưu sau mỗi lựa chọn, đóng trang mở lại vẫn chơi tiếp (thẻ lưu bằng mã E.cardId)
function packRun(s){return{fam:s.fam.id,role:s.role,name:s.name,style:s.style,gen:s.gen,sign:s.sign,bday:s.bday,m:s.m,tags:s.tags,flags:s.flags,offered:s.offered,
 used:[...s.used].map(E.cardId),log:s.log,i:s.i,stage:s.stage,lastD:s.lastD,
 deck:s.deck.map(x=>x.duel?{duel:x.duel===2?2:1,part:x.part||0,age:x.age}:x.vote?{vote:1,v:x.v,age:x.age}:{id:E.cardId(x.c),age:x.age,x:x.x?1:0,from:x.from||0,av:x.av?1:0}),
 whoStage:s.whoStage,minM:s.minM,moods:[...s.moods],npcAt:s.npcAt,whos:[...s.whos],seen:[...s.seen],lastAge:s.lastAge,duelStage:s.duelStage,duel:s.duel,duelState:s.duelState||null,
 k:s.k,kt:s.kt,kseq:s.kseq,cmp:s.cmp,rival:s.rival,lixi:s.lixi,lixiRes:s.lixiRes,bac:s.bac||null,
 famStart:s.famStart,fsBy:s.fsBy,ov:s.ov,perm:s.perm,evs:s.evs,lucky:s.lucky,famN:s.famN||0,cryN:s.cryN||0,duo:s.duo||null}}
const arr=a=>Array.isArray(a)?a:[],obj=o=>o&&typeof o==='object'&&!Array.isArray(o)?o:{};
const num3=a=>Array.isArray(a)&&a.length===3&&a.every(Number.isFinite);
const kObj=o=>{const x={};if(o&&typeof o==='object')for(const s of LD.SKILLS){const v=Math.floor(+o[s.id]);if(v>0)x[s.id]=Math.min(v,999)}return x};
const nat=v=>Math.max(0,Math.floor(+v)||0);
const famCount=o=>{const x={};if(o&&typeof o==='object')for(const f of LD.FAMS){const v=nat(o[f.id]);if(v)x[f.id]=Math.min(v,99)}return x};
const okOv=o=>o&&E.eventById(o.id)&&typeof o.pool==='string'&&Number.isInteger(o.until)?{id:o.id,pool:o.pool,until:o.until,solo:o.solo?1:0}:null;
const okStep=x=>x&&typeof x.q==='string'&&Array.isArray(x.opts)&&x.opts.length===2&&x.opts.every(o=>o&&typeof o.l==='string');
const okDuel=d=>d&&Array.isArray(d.rounds)&&d.rounds.length&&d.rounds.every(x=>x&&Array.isArray(x.steps)&&x.steps.length&&x.steps.every(okStep))&&(d.stop===undefined||Number.isInteger(d.stop))
 &&Number.isInteger(d.r)&&d.r>=0&&d.r<=d.rounds.length&&Number.isInteger(d.wins)&&d.wins>=0&&d.wins<=d.r
 &&(d.st===undefined||(Number.isInteger(d.st)&&d.st>=0&&(d.r>=d.rounds.length||d.st<d.rounds[d.r].steps.length)));
function unpackRun(r){try{
 const fam=E.famById(r.fam),card=id=>{const c=CARD_BY_ID.get(id);if(!c)throw new Error('thẻ đã đổi');return c};
 // ván nuôi chung vừa tạo chưa vào giai đoạn nào (stage -1)
 if(!fam||!E.signById(r.sign)||!(STAGES[r.stage]||(r.duo&&r.stage===-1))||!num3(r.m)||!num3(r.minM)||!Array.isArray(r.deck)||!Number.isInteger(r.i)||r.i<0||r.i>r.deck.length)return null;
 const base=E.newRun(fam,r.role==='bố'?'bố':'mẹ',String(r.name).slice(0,20),r.style?1:0,cleanGen(r.gen)||{n:1},r.sign),hasK=r.k&&typeof r.k==='object';
 return Object.assign(base,{k:hasK?kObj(r.k):base.k,kt:hasK?kObj(r.kt):base.kt,kseq:hasK?nat(r.kseq):base.kseq,cmp:nat(r.cmp),rival:typeof r.rival==='string'&&r.rival?r.rival.slice(0,20):base.rival,
  lixi:r.lixi&&Number.isInteger(r.lixi.n)&&r.lixi.n>=2&&r.lixi.n<=6?{n:r.lixi.n}:null,lixiRes:['chuan','vo','cat'].includes(r.lixiRes)?r.lixiRes:null,bac:r.bac==='gai'||r.bac==='trai'?r.bac:null,bday:/^\d\d\/\d\d$/.test(r.bday)?r.bday:'',m:r.m,tags:obj(r.tags),flags:obj(r.flags),offered:obj(r.offered),
  used:new Set(arr(r.used).map(card)),log:arr(r.log).filter(x=>x&&typeof x.r==='string'),i:r.i,stage:r.stage,lastD:num3(r.lastD)?r.lastD:[0,0,0],
  deck:r.deck.map(x=>x.duel?{duel:x.duel===2?2:x.part===1?1:true,part:x.part===1||x.part===2?x.part:0,age:x.age}:x.vote?{vote:1,v:nat(x.v),age:x.age}
   :Object.assign({c:card(x.id),age:x.age},x.x?{x:1}:{},x.from==='a'||x.from==='b'?{from:x.from}:{},x.av?{av:1}:{})),
  whoStage:obj(r.whoStage),minM:r.minM,moods:new Set(arr(r.moods)),npcAt:obj(r.npcAt),whos:new Set(arr(r.whos)),seen:new Set(arr(r.seen)),lastAge:+r.lastAge||0,duelStage:r.duelStage,duel:r.duel,duelState:okDuel(r.duelState)?r.duelState:null,
  famStart:E.famById(r.famStart)?r.famStart:fam.id,fsBy:famCount(r.fsBy),ov:okOv(r.ov),perm:arr(r.perm).filter(p=>typeof p==='string'&&(E.famById(p)||p.startsWith('ev:'))),
  evs:arr(r.evs).filter(id=>E.eventById(id)),lucky:r.lucky?1:0,famN:nat(r.famN),cryN:nat(r.cryN),duo:r.duo&&typeof r.duo==='object'&&r.duo.seats?r.duo:null});
}catch(e){return null}}
function saveRun(now){if(ROOM)return roomSave(now);SAVE.run=S?packRun(S):null;persist()}
function resume(){
 const s=unpackRun(SAVE.run);
 if(!s){SAVE.run=null;persist();return intro()}
 S=s;badgeQ={like:[],dislike:[]};voiceQ={};music('music_calm');
 const early=E.earlyEnd(S);
 if(early)return end(early,S.lastAge);
 render();
}

// ---------- tài khoản (tùy chọn): tên + mật khẩu, không email ----------
const ACC={api:false,rooms:false,token:'',name:'',timer:0,pending:false,sync:'',hidden:false};
try{const a=JSON.parse(localStorage.getItem('ld-auth')||'null');if(a&&a.token){ACC.token=a.token;ACC.name=a.name||''}}catch(e){}
const NAME_RE=/^[a-z0-9_.]{3,20}$/;
const ACC_ERR={bad_name:'Tên cần 3–20 ký tự: chữ không dấu, số, dấu _ hoặc dấu chấm.',bad_pass:'Mật khẩu cần từ 6 tới 72 ký tự.',
 name_taken:'Tên này có người lấy rồi. Thử tên khác nha.',wrong_login:'Sai tên hoặc mật khẩu.',locked:'Sai nhiều lần quá. Đợi 15 phút rồi thử lại nha.',
 rate_limited:'Bấm nhanh quá. Đợi một phút rồi thử lại nha.',net:'Mất mạng rồi. Kiểm tra mạng rồi thử lại nha.',server:'Máy chủ đang dỗi. Thử lại sau nha.'};
async function api(path,method,body,keepalive){
 const h={};if(body)h['content-type']='application/json';if(ACC.token)h.authorization='Bearer '+ACC.token;
 let r;try{r=await fetch('/api/'+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined,keepalive:!!keepalive,cache:'no-store'})}
 catch(e){throw Object.assign(new Error('net'),{code:'net'})}
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok)throw Object.assign(new Error(j.error||'server'),{code:j.error||'server',status:r.status});
 return j}
function accSet(token,name){ACC.token=token||'';ACC.name=name||'';try{token?localStorage.setItem('ld-auth',JSON.stringify({token,name})):localStorage.removeItem('ld-auth')}catch(e){}}
// mở bằng python http.server (không có API) thì ẩn hết phần tài khoản, game vẫn lưu trên máy như thường
async function apiCheck(){try{const r=await fetch('/api/health',{cache:'no-store'}),j=r.ok?await r.json():{};ACC.api=j.ok===true&&j.accounts!==false;ACC.rooms=j.ok===true&&j.rooms!==false}catch(e){ACC.api=false;ACC.rooms=false}}
function setSync(t){ACC.sync=t;document.querySelectorAll('.syncst').forEach(el=>el.textContent=t)}
// gửi lên sau 2,5 giây yên lặng: nhiều lượt vuốt liên tiếp gộp thành một lần gửi
function cloudPush(){if(!ACC.token||!ACC.api)return;ACC.pending=true;clearTimeout(ACC.timer);ACC.timer=setTimeout(cloudSend,2500)}
async function cloudSend(keepalive){
 if(!ACC.token||!ACC.api)return;clearTimeout(ACC.timer);ACC.pending=false;setSync('Đang lưu…');
 const tok=ACC.token;
 try{const j=await api('save','PUT',{save:SAVE},keepalive===true);
  if(ACC.token!==tok)return;
  // nhận thêm bộ sưu tập từ máy khác; đời và ván đang chơi giữ như trên máy này
  if(j.save){const c=normSave(j.save);for(const k of LISTS)SAVE[k]=[...new Set([...SAVE[k],...c[k]])];
   SAVE.best=betterBest(SAVE.best,c.best);SAVE.n18=Math.max(SAVE.n18,c.n18);SAVE.runs=Math.max(SAVE.runs,c.runs);SAVE.tut=SAVE.tut||c.tut?1:0;SAVE.duo=maxDuo(SAVE.duo,c.duo);persistLocal()}
  setSync('Đã lưu lên tài khoản')}
 catch(e){if(ACC.token!==tok)return;if(e.status===401){accSet('');setSync('')}else{ACC.pending=true;setSync('Chưa lưu được, sẽ thử lại');ACC.timer=setTimeout(cloudSend,15000)}}}
// lúc mở trang: lấy bản trên máy chủ về, gộp với bản trên máy
async function cloudPull(){
 const tok=ACC.token;
 try{const j=await api('save');if(ACC.token!==tok)return false;if(j.name)ACC.name=j.name;ACC.hidden=!!j.hidden;
  if(j.save){SAVE=mergeSave(SAVE,normSave(j.save));persistLocal()}
  if(!S)pick.gen=SAVE.gen||{n:1};
  cloudSend();return true}
 catch(e){if(e.status===401)accSet('');return false}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ACC.pending)cloudSend(true)});
window.addEventListener('pagehide',()=>{if(ACC.pending)cloudSend(true)});

 };

// ---------- gia cảnh: ô chọn, thẻ chi tiết (luật riêng), bốc thăm ----------
function famIco(f){const a=art('fam_'+f.id);return `<i>${a?img(a,'ico'):f.ico}</i>`}
function famLean(f){return E.famLean(f.id).map(skIco).join('')}
function famTile(f,sug){return `<button class="fam${sug?' sugd':''}" data-f="${f.id}">${sug?'<u class="sug">Gợi ý</u>':''}<span class="fh">${famIco(f)}<em class="lean" title="Nhà này hay nuôi khiếu">${famLean(f)}</em></span><b>${esc(f.name)}</b><small>${esc(f.sub)}</small></button>`}
// bốc thăm: mỗi gia cảnh một phần như nhau, gia cảnh hiếm chỉ ra ở đây
function drawFam(){const rare=LD.FAMS.filter(f=>f.rare),norm=LD.FAMS.filter(f=>!f.rare);return rare.length&&Math.random()<rare.length/LD.FAMS.length?rand(rare):rand(norm)}
function famSheet(f,name,lucky){
 const el=document.createElement('div');el.className='sheet';app.appendChild(el);
 const prevKey=onKey;onKey=null;let spin=0,ready=!lucky;
 const close=()=>{clearInterval(spin);el.remove();onKey=prevKey};
 const go=()=>{if(!ready)return;clearInterval(spin);el.remove();onKey=prevKey;startRun(f,name,lucky)};
 const lean=E.famLean(f.id).map(id=>{const s=E.skillById(id);return `${s.ico} ${s.name.toLowerCase()}`}).join(', ');
 const draw=()=>{el.innerHTML=`<div class="box sticker fsheet" role="dialog" aria-modal="true" aria-labelledby="fam-h"><button class="x" aria-label="Đóng">✕</button>
  ${lucky?'<p class="rollh">Số phận đã chọn!</p>':''}
  <div class="fbig">${famIco(f)}<span>${f.rare?'<em class="rare">Gia cảnh hiếm</em>':''}<b id="fam-h">${esc(f.name)}</b><small>${esc(f.sub)}</small></span></div>
  <p class="frule"><b>Luật nhà này:</b> ${esc(fill(f.rule))}</p>
  <p class="frow"><b>Lúc đầu:</b> ${f.m.map((v,k)=>`<span class="dt">${MICON[k]}${v}</span>`).join(' ')}</p>
  ${lean?`<p class="frow"><b>Nhà này hay nuôi khiếu:</b> ${lean}</p>`:''}
  <p class="frow">Có 5 tình huống chỉ nhà này gặp, câu hỏi Tết riêng và một <b>cái kết riêng</b>.</p>
  <button class="act main" id="f-go">Bắt đầu nuôi ${esc(name)} →</button>
  ${lucky?'':'<button class="linkbtn" id="f-back">Chọn nhà khác</button>'}</div>`;
  el.querySelector('.x').onclick=close;el.querySelector('#f-go').onclick=go;
  const bk=el.querySelector('#f-back');if(bk)bk.onclick=close;
  onKey=k=>{if(k==='Enter'||k===' ')go()}};
 el.onclick=e=>{if(e.target===el)close()};
 el.onkeydown=e=>{if(e.key==='Escape')close()};
 if(!lucky)return draw();
 // bốc thăm: các nhà lướt qua rồi dừng ở nhà được chọn
 el.innerHTML=`<div class="box sticker" role="dialog" aria-modal="true" aria-label="Đang bốc thăm gia cảnh"><div class="roll" id="roll">🎲</div><p class="rollh">Đang bốc thăm gia cảnh…</p></div>`;
 const all=LD.FAMS,t0=Date.now();let i=0;
 spin=setInterval(()=>{const r=el.querySelector('#roll');if(!r)return clearInterval(spin);
  if(Date.now()-t0>1300){clearInterval(spin);ready=true;sfx(f.rare?'ach':'sign_up',.7);draw();return}
  r.textContent=all[i++%all.length].ico;sfx('tick',.25)},90);
}
function startRun(fam,name,lucky){
 S=E.newRun(fam,pick.role,name,pick.style,pick.gen,pick.sign,lucky);S.bday=pick.bday;
 // lần đầu chơi: cảnh hướng dẫn trước khi con chào đời

}

// ---------- cảnh hướng dẫn: luật chơi, ý nghĩa 3 thanh, cá tính theo cung ----------
// Tự hiện một lần sau khi chọn gia cảnh (SAVE.tut); nút "Cách chơi" ở màn đầu mở lại bất cứ lúc nào.
const STYLE_TXT={chill:'thả lỏng, hệ chill',hai:'pha trò, chuyện gì cũng thành hài',kiluat:'kỷ luật, có kế hoạch',chieu:'chiều con',song:'bắt trend, sống ảo',lo:'lo xa, chu đáo'};
const METER_MEAN=[
 ['Con vui','Con có vui không.','Về 0: con buồn, dọn đi ở với dì.','Lên 100: con được chiều hư.'],
 ['Pin của bạn','Sức của bạn: thời gian, tiền, giấc ngủ.','Về 0: bạn gục.','Lên 100: bạn rảnh quá, buông con.'],

function tutorial(done,ctx){
 const g=E.signById(ctx.sign),gk=g&&E.skillById(g.k),fam=ctx.fam,m=ctx.m,who=ctx.name?esc(ctx.name):'Con';
 const steps=[
  ['Luật chơi siêu gọn',`<div class="tdemo" aria-hidden="true"><span class="tarr l">←</span><span class="tcard">Thẻ tình huống</span><span class="tarr r">→</span></div>

    <li>6 giai đoạn, từ lọt lòng tới 18 tuổi, chừng 6 phút.</li>
    <li>${fam?`Gia cảnh <b>${esc(fam.name)}</b>: ${esc(fill(fam.rule))} Nhà bạn còn có vài tình huống, câu hỏi Tết và một cái kết riêng.`:'Mỗi gia cảnh có luật riêng, vài tình huống, câu hỏi Tết và một cái kết riêng.'}</li>
    <li>Giữa chừng có thể gặp <b>biến cố gia đình</b>: ông bà lên ở cùng, thêm em bé, có khi cả nhà đổi đời.</li>
   </ul>`],
  ['3 thanh sống còn',`<div class="tmeters">${METER_MEAN.map(([n,a,lo,hi],k)=>`<div class="tm"><span class="tmi">${MICON[k]}</span><div><b>${n}</b>${m?`<small>lúc đầu ${m[k]}</small>`:''}<p>${a} ${lo} ${hi}</p></div></div>`).join('')}</div>
   <p class="trule"><b>Giữ cả 3 thanh ở khoảng giữa.</b> Chạm 0 hay 100 là ván kết thúc sớm. Thanh đổi màu và rung là sắp toang.</p>
   <p class="ttip">Mẹo: kéo thẻ từ từ, chấm đen hiện trên thanh nào thì thanh đó sẽ đổi, chấm to là đổi nhiều.</p>`],
  [`${who} có cá tính riêng`,`<ul class="tlist">

    <li>Mỗi lựa chọn là một kiểu phụ huynh. Tới 18 tuổi, kiểu bạn chọn nhiều nhất quyết định <b>cái kết</b>. Có ${E.ALL_ENDS.length} cái kết để sưu tập.</li>
    <li>Giữa chừng có <b>đấu khẩu ngày Tết</b>: bác hỏi xoáy, bạn có ${secTxt(E.DUEL_SECONDS)} giây để đáp khéo. Gặp "vụ tranh cãi" thì đáp hay bác còn phản pháo, phải thắng mọi hiệp. Cãi xong còn màn <b>lì xì kéo co</b>.</li>
    <li>Nuôi xong, ${who==='Con'?'con':who} lớn lên làm phụ huynh ở <b>đời sau</b>, mang theo nét gia truyền và nghề của mình.</li>
   </ul>`],
  [`${who} sẽ thành ai?`,`<ul class="tlist">
    <li>Nút có biểu tượng ${LD.SKILLS.map(s=>s.ico).join(' ')} là nuôi <b>năng khiếu</b> của con: ${LD.SKILLS.map(s=>s.name.toLowerCase()).join(', ')}.${gk?` Cung ${g.name} sinh ra đã có khiếu ${gk.ico}.`:''}</li>
    <li>Tới 18 tuổi, năng khiếu mạnh nhất cộng với kiểu phụ huynh quyết định <b>nghề của con</b>. Có ${E.ALL_JOBS.length} nghề để sưu tập.</li>

 onKey=()=>go();

 if(it.av)return `<span class="cchip">😭 Con đang ăn vạ: Con vui ×2</span>`;
 if(S.duo&&S.duo.mode==='con')return `<span class="cchip">😈 Con chọn ném vào bạn</span>`;
 return ''}
function choose(side){
 if(ROOM&&S.duo&&S.duo.mode==='cung')return cungChoose(side);
 if(busy)return;busy=true;onKey=null;
 const {c,age}=E.current(S),card=app.querySelector('#card');
 card.style.transform=`translateX(${side==='L'?-140:140}%) rotate(${side==='L'?-25:25}deg)`;card.style.opacity='0';
 const before=myM().slice(),o=E.choose(S,side);

 saveRun();
 setTimeout(()=>{

 },230);

// câu nhận xét theo cung: xào bài, dùng hết mới quay lại (không lặp nhàm)
let badgeQ={like:[],dislike:[]},lastBadge='';
function signBadge(){const g=E.sign(S);if(!g||!S.lastReact)return '';const like=S.lastReact==='like',k=like?'like':'dislike';
 if(!badgeQ[k].length){badgeQ[k]=E.shuffle(like?g.likes:g.dislikes);if(badgeQ[k][0]===lastBadge)badgeQ[k].push(badgeQ[k].shift())}
 lastBadge=badgeQ[k].shift();
 return `<p class="signbadge ${like?'like':'dislike'}">${zg(g)} ${esc(fill(lastBadge))} <b>${like?'+':'−'}${E.SIGN_BONUS} vui</b></p>`}
// giọng con theo cung: câu con nói, chọn theo biểu cảm; xào bài để không lặp; không phải lần nào cũng nói.

// D: viền + bóng thẻ theo màu nguyên tố, ký hiệu lơ lửng ở góc. C: khi con thích/ghét, ký hiệu bay quanh mặt (thích bay lên, ghét rơi xuống)
// k < 1: bay thấp và tỏa ngang (màn đấu khẩu, để không che chữ)
function sgBursts(g,up,k=1){let s='';
 {[[-120,-95],[-60,-150],[0,-175],[60,-150],[120,-95],[-140,-15],[140,-15]].forEach(([x,y],i)=>{
  s+=`<span class="sgburst${art('sign_'+g.id)?' art':''}" style="--dx:${up?Math.round(x*(k<1?1.3:1)):Math.round(x*1.2)}px;--dy:${up?Math.round(y*k):Math.round(Math.abs(y)*0.25+35)}px;--rot:${(i%2?1:-1)*(20+i*8)}deg;animation-delay:${i*45}ms">${zg(g)}</span>`})}
 return s}

// chạm chỗ nào trên màn cũng được (trừ nút âm thanh), không cần đúng vào thẻ
function afterReact(scr,age){
 waitTap(scr,()=>{busy=false;

}

// ---------- đấu khẩu ngày Tết, kiểu meme tòa án: PHẢN ĐỐI! · ĐỢI ĐÃ! · NHẬN LẤY! · PHẢN ĐỐI BỊ BÁC BỎ! ----------
const secTxt=s=>String(s).replace('.',',');
// bác ngày Tết: bác trai hoặc bác gái, chọn ngẫu nhiên mỗi ván lúc vào đấu khẩu (S.bac). mood: 'shock' (cứng họng), 'mad' (dọa giận)

function judgeArt(cls){const f=art('duel_ba_chu_toa');return f?img(f,cls):''}

// không che lời thoại: chữ của bác nằm ngay trên hộp thoại; chữ và hình bố / mẹ nằm dưới dòng kết quả (gọi sau khi đã chèn dòng đó)

 if(!S.bac)S.bac=art('duel_bac_gai')&&Math.random()<.5?'gai':'trai';
 const rounds=E.duelRounds(S),it=E.current(S),half=ROOM&&it&&it.part===1?Math.floor(rounds.length/2):0;
 S.duelState=half?{rounds,r:0,st:0,wins:0,stop:half}:{rounds,r:0,st:0,wins:0};saveRun();
 const judge=judgeArt('splpic');
 splash({pic:judge,big:'Đấu khẩu ngày Tết!',sub:`${judge?'Chủ tọa: bà nội. ':''}Bác hỏi xoáy, bạn đáp xoay. ${half?`Bạn đỡ ${half} vòng đầu, ${seatRole(partner())} đỡ nốt ${rounds.length-half} vòng ở ca sau.`:`${rounds.length} vòng.`} Mỗi câu ${secTxt(E.DUEL_SECONDS)} giây. Có vụ bác cãi tới cùng!`},()=>duel(rounds,0,0,0));

function duelResume(){const d=S.duelState,it=E.current(S);music('music_tet');setBg(TET_BG);sceneBg('scene_tet',TET_TINT,-1);
 // chia ca: phần 2 của trận, người ca 2 vào đỡ tiếp
 if(ROOM&&it&&it.part===2&&d.stop&&d.r===d.stop&&!ROOM.splashed['d2'+S.stage]){ROOM.splashed['d2'+S.stage]=1;
  return splash({big:'Bác phản pháo tiếp!',sub:`${cap(seatRole(partner()))} đã đỡ ${d.stop} vòng đầu, thắng ${d.wins}. Tới lượt bạn đỡ nốt.`},duelResume)}
 return d.r>=d.rounds.length?duelEnd(d.wins):duel(d.rounds,d.r,d.wins,d.st||0)}
// một hiệp: bác nói, bạn chọn câu đáp. Vụ tranh cãi (nhiều hiệp): đáp khéo thì bác phản pháo tiếp, đáp yếu là thua cả vụ.
function duel(rounds,r,wins,st){
 const {age}=E.current(S),rd=rounds[r],step=rd.steps[st],qs=rd.sign&&E.signById(rd.sign),qf=rd.fam&&E.famById(rd.fam),multi=rd.steps.length>1;
 const sk=rd.skill&&E.skillById(rd.skill),ev=sk&&typeof step.ev==='string'?step.ev:'',pf=()=>S.duelState&&S.duelState.proof?1:0;
 const lead=st>0?900:0;   // bác phản pháo: để chữ "ĐỢI ĐÃ!" hiện xong rồi mới tính giờ
 app.innerHTML=`<div class="screen duel">
  <div class="top"><div class="age">Tết năm con ${age} tuổi<small>Vòng ${r+1}/${rounds.length}${multi?` · Hiệp ${st+1}/${rd.steps.length}`:''}</small></div>

   ${sk?`<span class="duelsign" style="--el:#22B07D">${sk.ico} ${esc(S.name)} giỏi ${sk.name.toLowerCase()}: có bằng chứng!</span>`:''}
   <div class="dlg${qs?' sgq':''}${sk?' proof':''}"><span class="dlg-name">Bác</span><p>${esc(fill(step.q))}</p></div>
   <div class="kid">${faceArt(S.stage,st>0?'shock':'neutral',S.style)}</div>
  </div>
  <div class="dopts">${step.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span>${i?'→':'←'}</span>${esc(fill(o.l))}${ev&&o.win?'<i class="evb">Bằng chứng</i>':''}</button>`).join('')}</div>
 </div>`;
 if(st>0){objection('ĐỢI ĐÃ!','bac');sfx('shock',.6)}
 let done=false;

  const win=i!=null&&step.opts[i].win===1,slow=i==null,more=win&&st+1<rd.steps.length;

  if(win){sfx('duel_win',.7);if(qs)sfx('sign_up',.5,.15);bacMood('shock')}
  else{sfx('duel_lose',.7);dlg.insertAdjacentHTML('beforeend',`<span class="stamp">${slow?'Hết giờ!<br>Bị bác bỏ':'Phản đối<br>bị bác bỏ!'}</span>`)}
  kid.innerHTML=faceArt(S.stage,win?'sly':'cringe',S.style)+(qs&&win?sgBursts(qs,true,.3):'');
  dlg.insertAdjacentHTML('afterend',`<p class="dres ${win?'w':'l'}">${win?(multi?'Thắng cả vụ!':'Thắng!'):slow?'Hết giờ!':'Thua!'} ${esc(line)}<span class="tapn">${r+1<rounds.length?'Chạm để sang vòng sau':'Chạm để xem kết quả'}</span></p>`);

// Phòng nằm trên máy chủ (worker/index.js, /api/room). Máy người chơi tự chạy luật rồi ghi cả ván lên phòng:

const MODE_SUB={ca:'Mỗi người một ca, rảnh lúc nào vuốt lúc đó. Hết mỗi giai đoạn họp gia đình, bỏ phiếu kín một quyết định lớn. Ván dài gần gấp đôi.',
 cung:'Hai người online cùng lúc, cùng thấy một tình huống, chọn kín rồi lật. Cuối ván biết hai bạn hợp nhau bao nhiêu phần trăm.',
 con:'Một người làm bố hoặc mẹ, người kia vào vai con: con chọn tình huống ném cho bố mẹ, có nhiệm vụ bí mật.'};

function myRooms(){try{const o=JSON.parse(localStorage.getItem('ld-rooms')||'{}');return o&&typeof o==='object'&&!Array.isArray(o)?o:{}}catch(e){return{}}}
function saveRoom(id,info){const o=myRooms();if(info)o[id]={...(o[id]||{}),...info,at:Date.now()};else delete o[id];try{localStorage.setItem('ld-rooms',JSON.stringify(o))}catch(e){}}
async function roomApi(path,method,body,token){
 const h={};if(body)h['content-type']='application/json';if(token)h['x-seat']=token;
 let r;try{r=await fetch('/api/room'+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store',signal:ROOM&&ROOM.ctl&&method==='GET'?ROOM.ctl.signal:undefined})}
 catch(e){throw Object.assign(new Error(e.name==='AbortError'?'abort':'net'),{code:e.name==='AbortError'?'abort':'net'})}
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok)throw Object.assign(new Error(j.error||'server'),{code:j.error||'server',status:r.status,data:j});
 return j}
const roomLink=id=>location.origin+'/?duo='+id;
const roomCode=id=>String(id).toUpperCase().replace(/^(.{4})(.{4})$/,'$1-$2');
const parseCode=t=>{const c=String(t||'').toLowerCase().replace(/[^a-z2-9]/g,'');return ROOM_RE.test(c)?c:''};
const ROOM_ERR={net:'Mất mạng rồi. Kiểm tra mạng rồi thử lại nha.',no_room:'Không tìm thấy phòng này. Có thể link sai hoặc phòng đã quá 30 ngày.',full:'Phòng đủ hai người rồi.',
 rate_limited:'Bấm nhanh quá. Đợi một phút rồi thử lại nha.',server:'Máy chủ đang dỗi. Thử lại sau nha.',too_big:'Ván này dài quá, máy chủ không giữ nổi.',bad_state:'Ván này được tạo bằng bản game cũ, không mở tiếp được.'};

// ---- đóng gói ván để ghi lên phòng ----
function packDuo(s){return{v:1,run:packRun(s),pk:s.pk||{}}}
function unpackDuo(state){const s=state&&unpackRun(state.run);if(!s||!s.duo)return null;s.pk=state.pk&&typeof state.pk==='object'?state.pk:{};return s}
// thanh của người chơi trên máy này: Con vui chung + pin, thân của mình
function myM(){if(!ROOM||!S||!S.duo||S.duo.mode==='con')return S.m;const m=E.duoM(S,ROOM.seat);return[S.m[0],m[0],m[1]]}
function seatRole(s){return S.duo.seats[s].role}
function partner(){return E.other(ROOM.seat)}
const isKid=()=>S&&S.duo&&S.duo.mode==='con'&&S.duo.kid===ROOM.seat;
// chữ của một người cụ thể ({p} = người đó), ví dụ kể lại ca của người kia
function fillAs(t,r){const q=r==='bố'?'mẹ':'bố';return fill(t.replace(/\{p\}/g,r).replace(/\{P\}/g,cap(r)).replace(/\{q\}/g,q).replace(/\{Q\}/g,cap(q)))}
function dfill(t,seat){const x=seatRole(seat),y=seatRole(E.other(seat));return fill(t.replace(/\{X\}/g,cap(x)).replace(/\{x\}/g,x).replace(/\{Y\}/g,cap(y)).replace(/\{y\}/g,y))}

function roomFail(e){

async function enterRoom(id){
 const mine=myRooms()[id];if(!mine)return duoOpen(id);
 if(ROOM&&ROOM.ctl)ROOM.ctl.abort();
 ROOM={id,seat:mine.s,token:mine.t,ver:0,ctl:null,timer:0,dirty:false,seen:null,seenStep:-1,seenStage:-2,splashed:{}};
 try{history.replaceState(null,'','/?duo='+id)}catch(e){}
 app.innerHTML=`<div class="screen"><p class="bload">Đang mở phòng…</p></div>`;
 let r;try{r=await roomApi('/'+id,'GET',null,ROOM.token)}catch(e){return roomFail(e)}
 if(!r.seat){saveRoom(id,null);return duoOpen(id)}   // token cũ không còn ghế (bị mời người khác vào thay)
 if(!roomTake(r))return roomFail({code:'bad_state'});
 saveRoom(id,{mode:r.mode,kid:S.name});
 music('music_calm');duoNext();
}
// nhận ván từ máy chủ
function roomTake(r){const s=unpackDuo(r.state);if(!s)return false;S=s;ROOM.ver=r.ver;ROOM.mode=r.mode;ROOM.open=!!r.open;ROOM.seen=r.seen||ROOM.seen;badgeQ={like:[],dislike:[]};voiceQ={};return true}
function leaveRoom(){if(ROOM){if(ROOM.dirty)roomFlush();clearTimeout(ROOM.timer);if(ROOM.ctl)ROOM.ctl.abort()}ROOM=null;S=null;try{history.replaceState(null,'','/')}catch(e){}intro()}

// ---- ghi ván lên phòng: gộp nhiều bước liền nhau thành một lần ghi (now = ghi ngay, chờ xong) ----
function roomSave(now){
 if(!ROOM||!S)return;
 if(S.duo.mode==='cung'&&ROOM.seat!=='a')return;   // cùng vuốt: chỉ chủ phòng ghi ván
 ROOM.dirty=true;clearTimeout(ROOM.timer);
 if(now)return roomFlush();
 ROOM.timer=setTimeout(roomFlush,900);
}
async function roomFlush(){
 if(!ROOM||!ROOM.dirty)return true;
 clearTimeout(ROOM.timer);ROOM.dirty=false;
 const R=ROOM;
 try{const j=await roomApi('/'+R.id,'PUT',{ver:R.ver,state:packDuo(S)},R.token);if(ROOM===R)R.ver=j.ver;return true}
 catch(e){
  if(ROOM!==R)return false;
  if(e.code==='stale'&&e.data&&e.data.state){roomTake({state:e.data.state,ver:e.data.ver,mode:R.mode,open:R.open});tinyToast('Ván vừa được cập nhật từ máy bên kia.');duoNext();return false}
  R.dirty=true;R.timer=setTimeout(roomFlush,5000);tinyToast('Chưa lưu được lên phòng, sẽ thử lại.');return false}
}
function tinyToast(t){const el=document.createElement('div');el.className='toast';el.innerHTML=`<p>${esc(t)}</p>`;app.appendChild(el);setTimeout(()=>el.remove(),3500)}
// chờ người kia: giữ một yêu cầu tới khi ván đổi, rồi vẽ lại
async function roomPoll(){
 const R=ROOM;if(!R||R.ctl)return;
 R.ctl=new AbortController();
 try{
  while(ROOM===R){
   let r;try{r=await roomApi('/'+R.id+'?wait='+R.ver,'GET',null,R.token)}
   catch(e){if(e.code==='abort'||ROOM!==R)return;await new Promise(x=>setTimeout(x,4000));continue}
   if(ROOM!==R)return;
   if(r.ver!==R.ver||!!r.open!==!!R.open){if(!roomTake(r))return roomFail({code:'bad_state'});R.ctl=null;return duoNext()}
   R.seen=r.seen||R.seen;
  }
 }finally{if(ROOM===R)R.ctl=null}
}
function stopPoll(){if(ROOM&&ROOM.ctl){ROOM.ctl.abort();ROOM.ctl=null}}

// ---- điều phối: vẽ màn đúng với lượt và pha của ván ----
function duoNext(){
 busy=false;onKey=null;

 stopPoll();
 const d=S.duo;
 if(d.over)return duoEnd();
 const early=E.duoEarly(S);if(early&&d.ph!=='lobby')return duoOver(early);
 if(d.mode==='ca')return caNext();
 if(d.mode==='con')return conNext();
 return cungNext();
}

// ======== chia ca ========
function caNext(){

 if(d.turn!==me&&!d.solo)return waitScreen();
 if(!d.ph){E.duoStage(S,0);d.began='';saveRun(true);return caSplash()}
 if(d.ph==='vote')return voteScreen(d.turn);
 const seat=d.ph==='ca1'?'a':'b';
 if(d.began!==seat+S.stage){
  d.began=seat+S.stage;const n=E.duoBeginCa(S,seat);saveRun();
  if(seat==='b'&&!d.solo)return recapScreen(n);
 }
 E.duoUse(S,seat);
 if(S.lixi)return lixiIntro();
 if(E.duoCaEnd(S)){
  d.mark[seat]=S.log.length;
  if(d.ph==='ca1'){d.ph='ca2';d.turn='b';d.at=Date.now();saveRun(true);return d.solo?caNext():waitScreen({k:'Hết ca của bạn',t:`Tới ca của ${seatRole('b')}`,p:`Bạn đã lo xong những năm đầu của giai đoạn ${STAGES[S.stage].name.toLowerCase()}. Nhắc ${seatRole('b')} vào ca nha.`})}
  d.ph='vote';E.duoVoteStart(S);saveRun();return voteScreen('b');
 }
 return render();
}

  :`Hai người khác ý. ${esc(S.name)} nghe ${esc(seatRole(r.win))} (thân hơn): <b>${esc(fill(o.l))}</b>. Người kia tức, Pin −${E.DUO_LOSE}.`;
 return `<div class="votebox sticker"><small>${esc(head)}</small><p class="vq">${esc(fill(q.q))}</p>
  <div class="vrow"><span>${esc(cap(a))}: <b>${esc(fill(q[r.a].l))}</b></span><span>${esc(cap(b))}: <b>${esc(fill(q[r.b].l))}</b></span></div>
  <p>${how}</p><p class="vr">${esc(fill(o.r))}</p></div>`}
function voteReveal(res,before){
 sfx(res.win==='both'?'duel_win':'shock',.7);
 app.innerHTML=`<div class="screen vote">${topbar(S.lastAge)}<div class="table reveal">${voteResultBox(res,'Lật phiếu họp gia đình')}<div class="tap">Chạm để tiếp</div></div></div>`;

// ======== một người làm con ========
function conNext(){
 const d=S.duo,me=ROOM.seat;
 if(d.turn!==me)return waitScreen();
 if(d.ph==='pick')return kidPick();
 if(ROOM.seenStage!==S.stage){ROOM.seenStage=S.stage;return conSplash()}
 if(S.lixi)return lixiIntro();
 if(E.stageDone(S)){
  if(S.stage>=STAGES.length-1)return duoOver(null);
  d.mark[me]=S.log.length;E.conOffer(S,S.stage+1);d.at=Date.now();saveRun(true);
  return waitScreen({k:'Xong một giai đoạn',t:'Tới lượt con chọn tình huống',p:`${esc(S.name)} đang lựa xem ném gì cho bạn tiếp.`});
 }
 return render();
}
function conSplash(){
 app.innerHTML='<div class="screen"></div>';

}
// con chọn: mỗi cặp một thẻ, ăn vạ một thẻ; xem lại giai đoạn trước phụ huynh xử lý ra sao
function kidPick(){
 const d=S.duo,o=d.offer,mis=E.missionById(d.mission),par=S.role,si=o.si,prev=S.log.slice(d.mark.k||0);
 const sel=o.pairs.map(()=>-1);let av=null;
 setBg(STAGES[si].bg);stageTile(si);music('music_calm');
 const mini=(id,i,j)=>{const c=E.cardById(id);return `<button class="kc${sel[i]===j?' on':''}" data-i="${i}" data-j="${j}"><span class="who">${esc(fill(c.who))}</span><span class="kt">${esc(fill(c.t))}</span>
   <span class="ko">← ${esc(fill(c.L.l))} · ${esc(fill(c.R.l))} →</span>${sel[i]===j?`<em class="avb${av===id?' on':''}" data-av="${id}">${av===id?'😭 Đang ăn vạ':'😭 Ăn vạ thẻ này'}</em>`:''}</button>`};
 const draw=()=>{
  const ok=sel.every(x=>x>=0);
  app.innerHTML=`<div class="screen scroll kidpick">
   <h1 class="disp">Con chọn tình huống</h1>
   <p class="cl">${esc(STAGES[si].name)} · ${esc(STAGES[si].sub)}</p>
   <div class="mission sticker"><small>Nhiệm vụ bí mật của bạn</small><b>${esc(fill(mis.t))}</b><span>${esc(cap(par))} không biết nhiệm vụ này.</span></div>
   ${prev.length&&si>0?`<h2 class="sub3">Giai đoạn trước ${esc(par)} xử lý thế này</h2><div class="moments light">${prev.slice(-4).map(x=>`<p><b>${ageTxt(x.age)}</b> ${esc(fill(x.r))}</p>`).join('')}</div>`:''}
   ${famNote(S.note)?`<div class="kidnote">${famNote(S.note)}</div>`:''}
   ${o.forced.length?`<p class="frule">Không tránh được: ${o.forced.map(id=>`<b>${esc(fill(E.cardById(id).who))}</b>`).join(', ')}.</p>`:''}
   <p class="kh">Mỗi cặp chọn một tình huống để ném cho ${esc(par)}. Chạm "Ăn vạ" trên một thẻ đã chọn: Con vui ở thẻ đó lên xuống gấp đôi.</p>
   ${o.pairs.map((p,i)=>`<div class="kpair"><small>Cặp ${i+1}</small>${mini(p[0],i,0)}${mini(p[1],i,1)}</div>`).join('')}
   <button class="act main" id="kp-go"${ok?'':' disabled'}>${ok?`Ném cho ${esc(par)} →`:`Chọn đủ ${o.pairs.length} cặp đã nha`}</button>
   <button class="linkbtn" id="kp-home">Về màn đầu (để sau)</button></div>`;
  app.querySelectorAll('.kc').forEach(b=>b.onclick=e=>{const avb=e.target.closest('.avb');

   else{const i=+b.dataset.i,j=+b.dataset.j;if(sel[i]>=0&&av===o.pairs[i][sel[i]])av=null;sel[i]=j;sfx('swipe',.5)}
   const y=app.querySelector('.screen').scrollTop;draw();app.querySelector('.screen').scrollTop=y});
  app.querySelector('#kp-home').onclick=leaveRoom;
  app.querySelector('#kp-go').onclick=()=>{if(!sel.every(x=>x>=0))return;
   d.mark.k=S.log.length;E.conCommit(S,sel,av);d.at=Date.now();saveRun(true);sfx('sign_up',.6);
   waitScreen({k:'Đã ném',t:`Chờ ${par} xử lý`,p:`${cap(par)} sẽ gặp đúng những tình huống bạn chọn. Nhiệm vụ của bạn vẫn là bí mật.`})};
 };

// ======== cùng vuốt ========
// pk = { a: { s: bước, v }, b: ... } do /pick ghi. Chủ phòng thấy đủ hai lựa chọn của bước hiện tại thì chạy luật, xóa pk, ghi ván.
const pickOf=(s)=>{const p=S.pk&&S.pk[s];return p&&p.s===S.duo.step?p.v:undefined};
function cungNext(){
 const d=S.duo,me=ROOM.seat;
 if(d.ph==='lobby'){
  if(me==='a'&&!ROOM.open){E.cungStage(S,0);d.ph='play';S.pk={};saveRun(true);return cungNext()}
  return waitScreen(ROOM.open?{k:'Phòng đã tạo',t:'Chờ người kia vào phòng',p:'Đưa mã phòng cho người ấy. Người ấy nhập mã là bắt đầu.'}:{k:'Sắp bắt đầu',t:'Chờ chủ phòng mở màn',p:''});
 }
 if(me==='a'&&cungReady())return cungResolve();
 if(d.last&&ROOM.seenStep>=0&&d.last.step>ROOM.seenStep)return cungReveal();
 ROOM.seenStep=d.last?d.last.step:0;
 if(ROOM.seenStage!==S.stage){ROOM.seenStage=S.stage;return cungSplash()}
 const it=E.current(S);
 if(pickOf(me)!==undefined)return waitScreen(S.lixi?{k:'Lì xì kéo co',t:`Chờ ${seatRole(partner())} ghi nhận`,p:''}:{k:'Đã chọn kín',t:`Chờ ${seatRole(partner())} chọn`,p:'Hai người chọn xong là lật.'});
 if(S.lixi)return d.lixiBy===me?lixiIntro():waitScreen({k:'Lì xì kéo co',t:`${cap(seatRole(d.lixiBy||'b'))} đang nhận lì xì`,p:'Từ chối cho phải phép, tới lúc bác dọa giận thì nhận bằng hai tay.'});
 if(!it)return waitScreen();
 if(it.duel)return cungDuel();
 if(it.vote)return voteCung();
 return render();
}
function cungReady(){const d=S.duo;if(d.over)return false;if(S.lixi)return pickOf(d.lixiBy||'b')!==undefined;return pickOf('a')!==undefined&&pickOf('b')!==undefined}
// chủ phòng: chạy luật cho bước hiện tại
function cungResolve(){
 const d=S.duo,it=E.current(S),pa=pickOf('a'),pb=pickOf('b');
 if(S.lixi){const out=(pb&&pb.lixi)||(pa&&pa.lixi)||'cat';E.lixiFinish(S,out);d.step++;d.last={kind:'lixi',out,step:d.step}}
 else if(it&&it.duel)cungDuelResolve(pa,pb);
 else E.cungPick(S,pa==='R'?'R':'L',pb==='R'?'R':'L');
 S.pk={};
 const early=E.duoEarly(S);
 if(early){const res=E.duoResult(S,early);d.over=res;saveRun(true);return duoEnd()}
 if(!S.lixi&&!(E.current(S)&&E.current(S).duel)&&E.stageDone(S)){
  if(S.stage>=STAGES.length-1){d.over=E.duoResult(S,null);saveRun(true);return duoEnd()}
  E.cungStage(S,S.stage+1);
 }
 saveRun(true);return cungNext();
}
function cungSplash(){
 app.innerHTML='<div class="screen"></div>';
 const g=E.sign(S),si=S.stage;
 music('music_calm');sfx('stage',.8);
 splash(STAGES[si],cungNext,g?`<span style="color:${EL_COLOR[g.el]}">${zg(g)}</span> ${esc(g.name+': '+fill(g.stages[si]))}`:'',
  famNote(S.note)+`<p class="fnote">🤝 Hợp nhau tới giờ: ${S.duo.n?Math.round(S.duo.agree/S.duo.n*100):0}% (${S.duo.agree}/${S.duo.n} lần chọn giống nhau)</p>`+skillRow(S,si?`Năng khiếu của ${esc(S.name)}`:'Năng khiếu bẩm sinh'));
}
// vuốt ở chế độ cùng vuốt: chỉ gửi lựa chọn kín
async function cungChoose(side){
 if(busy)return;busy=true;onKey=null;
 const card=app.querySelector('#card');if(card){card.style.transform=`translateX(${side==='L'?-140:140}%) rotate(${side==='L'?-25:25}deg)`;card.style.opacity='0'}
 sfx('swipe',.7);
 await cungSend(side);
}
async function cungSend(v){
 const R=ROOM,step=S.duo.step;
 S.pk=S.pk||{};S.pk[R.seat]={s:step,v};
 try{const j=await roomApi('/'+R.id+'/pick','POST',{v:{s:step,v}},R.token);if(ROOM===R&&j.ver)R.ver=Math.max(R.ver,j.ver)}
 catch(e){if(ROOM!==R)return;busy=false;delete S.pk[R.seat];tinyToast(ROOM_ERR[e.code]||ROOM_ERR.server);return duoNext()}
 if(ROOM!==R)return;
 // chủ phòng tự đọc lại phòng để thấy lựa chọn của người kia (nếu đã có)
 if(R.seat==='a'){try{const r=await roomApi('/'+R.id,'GET',null,R.token);if(ROOM===R)roomTake(r)}catch(e){}}
 busy=false;duoNext();
}
// lật một bước vừa xong (thẻ, quyết định lớn, câu đấu khẩu, lì xì)
function cungReveal(){
 const d=S.duo,l=d.last,a=seatRole('a'),b=seatRole('b');ROOM.seenStep=l.step;
 let body='';
 if(l.kind==='card'){const c=E.cardById(l.id),o=c[l.side];sfx(l.win==='both'?'good':'shock',.6);
  body=`<div class="card sticker react"><span class="who">${l.win==='both'?'Đồng lòng!':'Bất đồng!'}</span><div class="face">${faceArt(S.stage,o.m||'neutral',S.style)}</div>
   <div class="vrow"><span>${esc(cap(a))}: <b>${esc(fill(c[l.a].l))}</b></span><span>${esc(cap(b))}: <b>${esc(fill(c[l.b].l))}</b></span></div>
   <p class="say">${esc(fill(o.r))}</p>${l.win==='both'?'':`<p class="votehint">${l.win==='ongba'?'Ông bà quyết.':`${esc(S.name)} nghe ${esc(seatRole(l.win))} (thân hơn).`} Người kia Pin −${E.CUNG_LOSE}.</p>`}<div class="tap">Chạm để tiếp</div></div>`}
 else if(l.kind==='vote')body=voteResultBox(l,'Lật phiếu quyết định lớn')+'<div class="tap">Chạm để tiếp</div>';
 else if(l.kind==='duel'){const rd=l.rd,st=rd.steps[l.st];sfx(l.ok?'duel_win':'duel_lose',.7);
  body=`<div class="card sticker react"><span class="who">Đấu khẩu ngày Tết · vòng ${l.r+1}</span><p class="say">Bác: “${esc(fill(st.q))}”</p>
   <div class="vrow"><span>${esc(cap(a))}: <b>${l.a==null?'Đứng hình':esc(fill(st.opts[l.a].l))}</b></span><span>${esc(cap(b))}: <b>${l.b==null?'Đứng hình':esc(fill(st.opts[l.b].l))}</b></span></div>
   <p class="say"><b class="disp big2">${l.ok?(l.more?'Bác phản pháo tiếp!':'Thắng vòng này!'):'Thua vòng này!'}</b></p><div class="tap">Chạm để tiếp</div></div>`}
 else if(l.kind==='lixi')body=`<div class="card sticker react"><span class="who">Lì xì kéo co</span><p class="say">${esc(fill(rand(LD.LIXI[l.out]||LD.LIXI.cat)))}</p><div class="tap">Chạm để tiếp</div></div>`;
 app.innerHTML=`<div class="screen">${topbar(S.lastAge)}<div class="table">${body}</div></div>`;
 waitTap(app.querySelector('.screen'),()=>duoNext());
}
function voteCung(){
 const d=S.duo,it=E.current(S),q=LD.DUO_VOTES[it.v];
 setBg(STAGES[S.stage].bg);stageTile(S.stage);
 app.innerHTML=`<div class="screen vote">${topbar(S.lastAge)}
  <div class="table"><div class="card sticker votecard"><span class="who">Quyết định lớn</span><div class="face">${faceArt(S.stage,'neutral',S.style)}</div>
   <p class="say">${esc(fill(q.q))}</p><p class="votehint">Chọn kín. Khác ý thì con nghe người thân hơn.</p></div></div>
  <div class="opts"><button class="opt l" id="bl"><span>←</span>${esc(fill(q.L.l))}</button><button class="opt r" id="br"><span>→</span>${esc(fill(q.R.l))}</button></div></div>`;
 app.querySelector('#bl').onclick=()=>cungChoose('L');app.querySelector('#br').onclick=()=>cungChoose('R');
 onKey=k=>{if(k==='ArrowLeft')cungChoose('L');if(k==='ArrowRight')cungChoose('R')};
}
// đấu khẩu khi cùng vuốt: hai người cùng đáp từng câu, một người đáp khéo là thắng câu đó
function cungDuel(){
 const d=S.duo;
 if(!d.duel){   // chủ phòng mở trận: bốc các vòng
  if(ROOM.seat!=='a')return waitScreen({k:'Tết đến rồi',t:'Đang dọn mâm cỗ…',p:''});
  if(!S.bac)S.bac=art('duel_bac_gai')&&Math.random()<.5?'gai':'trai';
  d.duel={rounds:E.duelRounds(S),r:0,st:0,wins:0,proof:0};saveRun(true);
 }
 const D=d.duel,rd=D.rounds[D.r],step=rd.steps[D.st],{age}=E.current(S),qs=rd.sign&&E.signById(rd.sign),qf=rd.fam&&E.famById(rd.fam),sk=rd.skill&&E.skillById(rd.skill);
 if(!ROOM.splashed['duel'+S.stage]){ROOM.splashed['duel'+S.stage]=1;music('music_tet');sfx('duel_start',.8);setBg(TET_BG);sceneBg('scene_tet',TET_TINT,-1);
  app.innerHTML='<div class="screen"></div>';
  return splash({big:'Đấu khẩu ngày Tết!',sub:`Hai người cùng đỡ bác: mỗi câu cả hai cùng đáp kín, chỉ cần một người đáp khéo là thắng. ${D.rounds.length} vòng, mỗi câu ${secTxt(E.DUEL_SECONDS)} giây.`},cungDuel)}
 music('music_tet');setBg(TET_BG);sceneBg('scene_tet',TET_TINT,-1);
 app.innerHTML=`<div class="screen duel">
  <div class="top"><div class="age">Tết năm con ${age} tuổi<small>Vòng ${D.r+1}/${D.rounds.length}${rd.steps.length>1?` · Hiệp ${D.st+1}/${rd.steps.length}`:''}</small></div>
   <div class="score">${D.rounds.map((x,i)=>lantern(i<D.wins)).join('')}</div></div>
  <div class="timer"><i style="animation-duration:${E.DUEL_SECONDS}s"></i></div>
  <div class="arena"${qs?` style="--el:${EL_COLOR[qs.el]}"`:''}>
   ${rd.title?`<span class="case">⚖️ ${esc(rd.title)}</span>`:''}
   <div class="bac">${bacArt()}</div>
   ${qs?`<span class="duelsign">${zg(qs)} Câu theo cung ${qs.name}</span>`:''}${qf&&!rd.title?`<span class="duelsign" style="--el:var(--ink)">${qf.ico} Câu theo gia cảnh: ${esc(qf.name)}</span>`:''}
   ${sk?`<span class="duelsign" style="--el:#22B07D">${sk.ico} ${esc(S.name)} giỏi ${sk.name.toLowerCase()}: có bằng chứng!</span>`:''}
   <div class="dlg${qs?' sgq':''}${sk?' proof':''}"><span class="dlg-name">Bác</span><p>${esc(fill(step.q))}</p></div>
   <div class="kid">${faceArt(S.stage,D.st>0?'shock':'neutral',S.style)}</div></div>
  <div class="dopts">${step.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span>${i?'→':'←'}</span>${esc(fill(o.l))}${sk&&step.ev&&o.win?'<i class="evb">Bằng chứng</i>':''}</button>`).join('')}</div></div>`;
 let done=false;
 const answer=i=>{if(done)return;done=true;clearTimeout(timer);onKey=null;app.querySelectorAll('.dopts .opt').forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('right')});cungSend(i==null?null:i)};
 const timer=setTimeout(()=>answer(null),E.DUEL_SECONDS*1000);
 app.querySelectorAll('.dopts .opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 onKey=k=>{if(k==='ArrowLeft')answer(0);if(k==='ArrowRight')answer(1)};
}
function cungDuelResolve(pa,pb){
 const d=S.duo,D=d.duel,rd=D.rounds[D.r],st=rd.steps[D.st],win=i=>i!=null&&st.opts[i]&&st.opts[i].win===1,ok=win(pa)||win(pb),more=ok&&D.st+1<rd.steps.length;
 d.step++;d.last={kind:'duel',a:pa,b:pb,ok,more,r:D.r,st:D.st,rd,step:d.step};
 if(more){D.st++;return}
 if(ok){D.wins++;if(rd.skill)D.proof=1}
 D.r++;D.st=0;
 if(D.r>=D.rounds.length){E.duelFinish(S,D.wins,!!D.proof);d.duel=null;E.lixiStart(S);d.lixiBy='b'}
}

// ======== màn chờ, đồng hồ, nhắc người kia ========
function duoMeters(){
 if(S.duo.mode==='con')return `<div class="dmeters"><span>${MICON[0]}<b>${S.m[0]}</b>Con vui</span><span>${MICON[1]}<b>${S.m[1]}</b>Pin ${esc(S.role)}</span><span>${MICON[2]}<b>${S.m[2]}</b>Thân</span></div>`;
 const a=E.duoM(S,'a'),b=E.duoM(S,'b'),row=(s,m)=>`<span class="${s===ROOM.seat?'me':''}"><em>${esc(cap(seatRole(s)))}${s===ROOM.seat?' (bạn)':''}</em>${MICON[1]}<b>${m[0]}</b>${MICON[2]}<b>${m[1]}</b></span>`;
 return `<div class="dmeters"><span>${MICON[0]}<b>${S.m[0]}</b>Con vui (chung)</span>${row('a',a)}${row('b',b)}</div>`}
function waitScreen(banner){
 const d=S.duo,me=ROOM.seat,p=partner(),pr=S.duo.mode==='con'?(isKid()?S.role:'con'):seatRole(p),age=S.deck[S.i]?S.deck[S.i].age:S.lastAge;
 const idle=!ROOM.open&&ROOM.seen&&ROOM.seen[p]&&Date.now()-ROOM.seen[p]>48*3600e3;   // ROOM.seen = lần cuối mỗi ghế gọi máy chủ
 const title=banner?banner.t:ROOM.open?`Chờ ${pr} vào phòng`:d.mode==='ca'?(d.ph==='vote'?`Chờ ${pr} bỏ phiếu`:`Tới ca của ${pr}`):d.mode==='con'?(d.ph==='pick'?'Chờ con chọn tình huống':`Chờ ${pr} xử lý`):`Chờ ${pr}`;
 setBg(STAGES[Math.max(0,S.stage)].bg);stageTile(Math.max(0,S.stage));
 app.innerHTML=`<div class="screen scroll duowait">
  ${banner&&banner.k?`<div class="evbox"><small>${esc(banner.k)}</small>${banner.p?`<p>${esc(banner.p)}</p>`:''}</div>`:''}
